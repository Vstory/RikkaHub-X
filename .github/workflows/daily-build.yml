name: Daily Build

# run 标题(2026-09-10 引入,2026-09-12 改):本 workflow 仅手动触发,默认标题就是 workflow 名,
# 多跑几次分不清批次;带上渠道与分支后可辨认。
#
# 渠道名用与 Release 页面**同一套词汇**(Nightly Build / Release Build),而不是裸的
# `nightly` / `release` —— 后者只差一个词,列表里扫一眼容易看串;且 `release` 在别处既指
# 构建类型、又指 AGP 变体名,单独出现有歧义。改成页面名后,运行标题与它产出的页面可互相检索。
# ⚠️ `A && B || C` 是 GitHub 官方的三目写法(文档「Evaluate expressions」明确给出),但有个前提:
#    **B 必须为真值** —— 否则会静默落到 C。这里 B 是非空字符串 'Release Build',恒为真,故安全。
#    将来若把 B 改成可能为空/为 false 的值(如 '')，这个写法会失效,须改用别的结构。
run-name: "Daily Build · ${{ inputs.build_type == 'release' && 'Release Build' || 'Nightly Build' }} · ${{ github.ref_name }}"

on:
  # 2026-09-10:定时自动构建已停用(注释掉 schedule),仅保留手动触发。
  # 原因:不再需要按时间自动打包,历史凌晨自动构建积累大量重复 APK。
  # 如需恢复定时构建,取消下面两行注释即可。
  # schedule:
  #   - cron: '0 9,18 * * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型: nightly=随机临时签名测试版(默认) / release=正式固定签名(需配置 KEY_BASE64 等 secrets)'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

# 供应链加固(2026-09-09):第三方 action 全部 pin 到 commit SHA,
# 避免可变 tag 被上游改动/账号被盗后投毒。
# 2026-09-09 第二次加固:Node.js 20 弃用警告,action 大版本整体升级到 node24 runtime:
#   actions/checkout            v4->v7   3d3c42e5
#   actions/setup-java          v4->v6   de7274f0
#   actions/setup-node          v4->v7   82076278
#   actions/cache               v4->v6   55cc8345
#   pnpm/action-setup           v4->v6   ea17c68d
#   softprops/action-gh-release v2->v3   efb35369

# 并发：**不设 concurrency 锁**（2026-09-10 移除）。
# 原先用 concurrency.group 强制串行，理由是"避免并发往同一个 nightly release
# 上传/清理冲突"。但那是**用锁掩盖脚本竞态**——正确做法是让脚本本身幂等：
#   - Cleanup 改为「保留最新 6 组构建」的不变式，任何交错都收敛到同一稳态，
#     且永不删到更新的产物（详见该步骤注释）
#   - 重复删除按 404 容忍，不再使步骤误报失败
# 故并发构建现在是安全的，无需人为排队（GitHub 默认本就允许并行）。

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          # ⚠️ secret 一律经 env 传入、脚本里只引用变量名，**不把值插进 run 脚本文本**。
          #    理由：值里若含 $ 或反引号，插进脚本会被 shell 二次展开。
          #    实测正式 keystore 的口令里就有 $，旧写法（echo "${{ secrets.X }}"）
          #    会把口令吃掉一截，而且在签名报错之前没有任何提示。
          X_KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          X_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          X_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          X_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          X_GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'nightly' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            # 选了正式构建却缺 secret → **直接失败**，不静默回退到随机签名。
            # 回退的后果是：产物看着"构建成功"，签名却不对，要等用户安装时才发现升不了级。
            missing=""
            for v in X_KEY_BASE64 X_SIGNING_STORE_PASSWORD X_SIGNING_KEY_ALIAS X_SIGNING_KEY_PASSWORD; do
              [ -n "${!v}" ] || missing="$missing $v"
            done
            if [ -n "$missing" ]; then
              echo "❌ 选择了 release 构建，但以下 secret 为空:$missing"
              echo "   拒绝回退到随机签名（那会让产物无法与后续正式包互相覆盖安装）。"
              exit 1
            fi
            # 正式构建(release)且已提供密钥:解码正式 keystore → 固定正式签名,接真实 Firebase
            echo "正式构建:使用正式密钥固定签名(commit ${{ github.sha }})"
            printf '%s' "$X_KEY_BASE64" | base64 -d > app/app.key
            # storeFile 由 runner 现场拼（GITHUB_WORKSPACE），与 nightly 分支同一来源 ——
            # 不写死仓库在 runner 上的路径名，改名/换布局都不会失配。
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/app/app.key" > local.properties
            printf 'storePassword=%s\n' "$X_SIGNING_STORE_PASSWORD" >> local.properties
            printf 'keyAlias=%s\n' "$X_SIGNING_KEY_ALIAS" >> local.properties
            printf 'keyPassword=%s\n' "$X_SIGNING_KEY_PASSWORD" >> local.properties
            printf '%s\n' "$X_GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            # 其余(nightly 默认 / 未提供密钥):每次构建生成一次性随机临时 keystore 签名。
            # 随机口令 + 随机 dname → 每次产物签名指纹不同,仅供测试分发,升级需重装。
            # (即使仓库配了密钥,只要没主动选 release,仍走随机签名——2026-09-10 用户确认)
            # 注意:keytool 生成时【不要】单独 -keypass,JKS 中 key 密码默认=store 密码;
            # 若 keypass≠storepass,AGP 用 storePassword 解 key 会报 "Given final block not properly padded"。
            echo "nightly 构建:每次随机临时签名(commit ${{ github.sha }})"
            SP="$(openssl rand -hex 16)"
            DN="CN=RikkaHubX Nightly $(date +%s), O=RikkaHubX Dev, C=CN"
            keytool -genkeypair -v -keystore app/app.key \
              -storepass "$SP" \
              -alias rikkahub \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "$DN" >/dev/null 2>&1
            echo "storeFile=${GITHUB_WORKSPACE}/app/app.key" > local.properties
            echo "storePassword=$SP" >> local.properties
            echo "keyAlias=rikkahub" >> local.properties
            echo "keyPassword=$SP" >> local.properties
            cp .github/google-services.placeholder.json app/google-services.json
          fi

      # 计算短提交号与构建时间戳(北京时间)。须在构建**之前**完成 —— 时间戳要作为
      # -Px.build.info 传给 Gradle,用于 versionCode 与 versionName(见 app/build.gradle.kts)。
      # APK 文件名 / versionCode / versionName 三处时间必须一致,故三者取自**同一次 date 调用**,
      # 否则临近分钟或跨日边界时三处会不一致:
      #   info = "<epoch 秒>|<yyMMdd>|<8 位短哈希>"
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        id: ts
        run: |
          NOW=$(date +%s)
          echo "ts=$(TZ=Asia/Shanghai date -d "@$NOW" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "info=$NOW|$(TZ=Asia/Shanghai date -d "@$NOW" +%y%m%d)|${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Px.build.info="${{ steps.ts.outputs.info }}"

      # 把 APK 重命名：文件名带「构建时间(北京时间)+短提交号」。
      # 时间戳放前部便于肉眼按时间辨认，同一次构建的三包相邻；短号用于对应 commit。
      # ⚠️ 注意：GitHub **不支持**控制 release 资产显示顺序 —— 资产列表始终按上传顺序
      #    (旧→新)排列，文件名排序无法改变它(softprops/action-gh-release 文档明确：
      #    "does not control the final asset ordering")。
      #    故「最新构建置顶」改由 release 说明(body)实现 —— 见下方 Generate release body。
      # 例：app-20260910-0215-arm64-v8a-nightly-a1b2c3d4.apk（第三段为渠道标记）
      - name: Rename APKs with build time & commit hash
        env:
          # 文件名第三段标出**渠道**（nightly / release），不再是 AGP 的构建变体名 ——
          # 原先一律写 `release`（AGP 输出 `app-release.apk` 的变体名），于是 nightly 页面上
          # 的产物也叫 `…-release-….apk`，在页面与资产列表里看着像一个正式包。
          CHANNEL: ${{ github.event.inputs.build_type || 'nightly' }}
        run: |
          cd app/build/outputs/apk/release
          [ "$CHANNEL" = "release" ] || CHANNEL=nightly
          echo "渠道标记: ${CHANNEL}"
          for f in *.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "app-${{ steps.ts.outputs.ts }}-${abi}-${CHANNEL}-${{ steps.sha.outputs.short }}.apk"
          done
          ls -l

      # 决定本次产物发到哪个 Release。两者**必须是不同的 Release**：共用同一个 tag 时，
      # 后一次构建的说明会整段覆盖前一次 —— 实测正式包的说明把 nightly 页面的免责声明刷掉了。
      #   nightly → 固定 tag `nightly`（下载入口稳定），预发布
      #   release → 独立 tag `v<基础版本>-x<序号>`，正式发布（非预发布）
      # 决定本次产物发到哪个 Release。两类构建各用**一个固定 tag**，下载入口长期稳定。
      # 两者必须是不同的 Release：共用同一个 tag 时，后一次构建的说明会整段覆盖前一次 ——
      # 实测正式包的说明把 nightly 页面的免责声明刷掉了。
      #   nightly → tag `nightly`，随机临时签名（装前须卸载）
      #   release → tag `release`（页面名 `Release Build`），固定密钥签名（可直接覆盖升级）
      # 两者都标记为预发布：本仓库是自用派生版本，不对外声称稳定正式版。
      - name: Resolve release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'nightly' }}"
          if [ "$BUILD_TYPE" != "release" ]; then
            {
              echo "tag=nightly"
              echo "name=Nightly Build"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "is_nightly=true"
              echo "channel=nightly"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            echo "nightly → 固定 tag nightly（预发布，随机临时签名）"
            exit 0
          fi

          # tag 固定，但页面要显示当前版本，故仍从**构建产物**读 versionName（权威）。
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          AAPT2="$(command -v aapt2 || true)"
          for home in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$home" ] || continue
            [ -n "$AAPT2" ] && break
            AAPT2="$(ls -d "$home"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          done
          FULL=""
          if [ -n "$APK" ] && [ -n "$AAPT2" ]; then
            FULL="$("$AAPT2" dump badging "$APK" 2>/dev/null \
              | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" | head -1)"
          fi
          if [ -z "$FULL" ]; then
            # 兜底：aapt2 不可用时读构建脚本的默认 versionName（X 定制把它拼成 <默认>+<日期>.<短号>）
            FULL="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
            echo "⚠️ aapt2 不可用或找不到产物，versionName 改从 app/build.gradle.kts 读取: ${FULL}"
          fi
          echo "版本: ${FULL:-（读不到）}"

          {
            echo "tag=release"
            echo "name=Release Build"
            echo "prerelease=true"
            echo "make_latest=false"
            echo "is_nightly=false"
            echo "channel=release"
            echo "version=${FULL}"
          } >> "$GITHUB_OUTPUT"
          echo "release → 固定 tag release（预发布，固定密钥签名）"

      # 断言产物确实由**固定密钥**签名，并把证书指纹传给发布说明。
      #
      # 为什么必须断言：AGP 在 signingConfig 为空时**不报错**，而是产出 app-release-unsigned.apk；
      # 而重命名用 `*.apk` 通配 → unsigned 包会连同正式包一起被发布，产物外观一切正常，
      # 装到手机上才发现升不了级。签名这种事一旦错了只在用户侧暴露，必须在构建期拦住。
      - name: Verify signing certificate
        if: success()
        env:
          EXPECTED_SHA256: EE96008F1B4C668D23463B8482C33ED6D429C7F76546FE433C7B3C6D27EA1A08
        run: |
          # ① 任何构建类型都不许出现未签名产物
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "❌ 出现未签名产物，拒绝发布："
            ls -l app/build/outputs/apk/release/*unsigned*.apk
            exit 1
          fi

          if [ "${{ steps.target.outputs.is_nightly }}" = "true" ]; then
            echo "nightly → 按设计使用随机临时签名，跳过固定签名断言"
            echo "CERT_SHA256=（nightly 随机临时签名，无固定指纹）" >> "$GITHUB_ENV"
            exit 0
          fi

          APKSIGNER="$(command -v apksigner || true)"
          for home in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$home" ] || continue
            [ -n "$APKSIGNER" ] && break
            APKSIGNER="$(ls -d "$home"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          done
          if [ -z "$APKSIGNER" ]; then
            echo "❌ 找不到 apksigner，无法断言签名 —— 拒绝发布。"
            echo "   已查：PATH、\$ANDROID_HOME、\$ANDROID_SDK_ROOT、/usr/local/lib/android/sdk"
            exit 1
          fi
          echo "使用 apksigner: ${APKSIGNER}"

          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "❌ 找不到 arm64-v8a 产物，无法验证签名"; exit 1; }

          # 指纹一律归一化成「去掉冒号的大写十六进制」再比对 —— 期望值不论写成
          # `EE:96:...` 还是 `ee96...` 都能对上，避免比对手工维护的字符串格式。
          norm() { tr -d ':\r\n' | tr 'a-f' 'A-F'; }

          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | norm)"
          EXPECTED="$(printf '%s' "$EXPECTED_SHA256" | norm)"

          echo "产物签名证书 SHA-256: ${ACTUAL:-（读不到）}"
          echo "固定密钥期望指纹  : ${EXPECTED}"

          # ⚠️ 先确认**真的读到了**指纹。否则「apksigner 解析失败 → ACTUAL 为空」会与
          #    「期望值为空」误判为相等 → 检查静默通过。读不到就必须拦住，不能算通过。
          case "$ACTUAL" in
            [0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F]*) ;;
            *) echo "❌ 读不到签名证书指纹（apksigner 未能解析产物）—— 拒绝发布。"; exit 1 ;;
          esac
          if [ "${#ACTUAL}" -ne 64 ]; then
            echo "❌ 签名证书指纹长度异常（${#ACTUAL}，应为 64）—— 拒绝发布。"
            exit 1
          fi
          case "$EXPECTED" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "❌ 期望指纹未配置或长度异常（${#EXPECTED}）—— 拒绝发布。"; exit 1 ;;
          esac

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ 签名证书与固定密钥不一致 —— 产物不是用正式密钥签的，"
            echo "   发出去用户将无法覆盖升级。"
            exit 1
          fi
          echo "✅ 签名一致：产物由固定正式密钥签名"
          echo "CERT_SHA256=${ACTUAL}" >> "$GITHUB_ENV"

      # 生成 release 说明(新 → 旧)。
      # 为什么要有这一步：GitHub 的 release 资产列表**固定按上传顺序(旧→新)**显示，
      # 且没有 API/设置可以调整(见 Rename 步骤注释)。而说明(body)渲染在资产列表**上方**，
      # 所以把「最新构建」的直链做成表格放说明里 → 打开 release 页第一眼就是最新产物。
      # 历史构建按时间**倒序**列出(最多 6 次)，同样新在上。
      - name: Generate release body (newest first)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_NIGHTLY: ${{ steps.target.outputs.is_nightly }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          TS="${{ steps.ts.outputs.ts }}"
          SHA="${{ steps.sha.outputs.short }}"
          BASE="https://github.com/${REPO}/releases/download/${TARGET_TAG}"
          # 时间戳 20260910-0925 → 可读 2026-09-10 09:25
          PRETTY="${TS:0:4}-${TS:4:2}-${TS:6:2} ${TS:9:2}:${TS:11:2}"

          abi_label() {
            case "$1" in
              arm64-v8a) echo "真机(绝大多数手机)" ;;
              universal) echo "通用包(所有架构,体积最大)" ;;
              x86_64)    echo "模拟器 / x86_64" ;;
            esac
          }

          BODY="${GITHUB_WORKSPACE}/release_body.md"
          cd app/build/outputs/apk/release

          {
            # 两个页面都在最顶部放声明框，风格一致（CAUTION 在 GitHub 上是红色，最醒目）。
            if [ "$IS_NIGHTLY" = "true" ]; then
              # 免责声明：nightly 页面会被搜到/被直接下载，必须在最顶部劝退非开发者。
              echo "> [!CAUTION]"
              echo "> **本页面为自动构建的开发测试版,功能不稳定,仅供开发者测试功能使用,请勿下载。**"
              echo
              # 完整 SHA 是链接（点开即看是哪次提交），短号另附 —— 短号用于和 APK 里的
              # versionName、以及文件名末尾的短号对照，肉眼比对时比 40 位长号方便。
              echo "自动构建 · commit [\`${{ github.sha }}\`](https://github.com/${REPO}/commit/${{ github.sha }})(短号 \`${SHA}\`)"
              echo
              echo "## 📥 最新构建 · ${PRETTY}(北京时间)"
            else
              # Release Build：签名固定、可覆盖升级，但仍是派生自用版本，不声称稳定。
              # 与 nightly 的声明保持同一句式（定位 → 状态 → 适用 → 禁令），只换四个词：
              #   开发测试版 → 尝鲜版；功能不稳定 → 功能仍在快速迭代；
              #   仅供开发者测试功能使用 → 仅供尝鲜体验；请勿下载 → 请勿用于重要场景。
              echo "> [!CAUTION]"
              echo "> **本页面为自动构建的尝鲜版,功能仍在快速迭代,仅供尝鲜体验,请勿用于重要场景。**"
              echo
              echo "自动构建 · \`${VERSION}\` · commit [\`${{ github.sha }}\`](https://github.com/${REPO}/commit/${{ github.sha }})(短号 \`${SHA}\`)"
              echo
              echo "## 📥 最新构建 · ${PRETTY}(北京时间)"
            fi
            echo
            echo "| 架构 | 适用 | 下载 |"
            echo "|---|---|---|"
            for abi in arm64-v8a universal x86_64; do
              f="app-${TS}-${abi}-${CHANNEL}-${SHA}.apk"
              if [ -f "$f" ]; then
                mb="$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.1f", b/1048576}')"
                echo "| \`${abi}\` | $(abi_label "$abi") | [⬇ 下载 ${mb} MB](${BASE}/${f}) |"
              fi
            done
            echo
            if [ "$IS_NIGHTLY" = "true" ]; then
              echo "> ⚠️ nightly 为**随机临时签名**,每次构建签名不同 → 安装前请先**卸载旧版**(不能覆盖升级)。"
              echo ">"
              echo "> 需要能直接覆盖升级的包,请用 [Release Build](https://github.com/${REPO}/releases/tag/release)。"
            else
              # 与 nightly 脚注同构：第一句讲「签名性质 → 安装影响」，第二句给可核对的凭据。
              echo "> 🔒 尝鲜版为**固定密钥签名**,每次构建签名相同 → 可直接**覆盖升级**(无需卸载旧版)。"
              echo ">"
              echo "> 签名证书 SHA-256：\`${CERT_SHA256}\`,装前可与本地包比对确认。"
            fi
            echo
          } > "$BODY"

          # 历史构建：从**本渠道**已有 asset 名解析出 (时间戳, 短号)，去重后倒序 → 新在上。
          # ⚠️ 必须用 ${TARGET_TAG} —— 原先写死 nightly，导致尝鲜版页面列出的是 nightly 的产物，
          #    而链接按 BASE 拼成了 /download/release/…，点开全是 404。
          mapfile -t PREV < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/releases/tags/${TARGET_TAG}" \
            --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/^app-([0-9]{8}-[0-9]{4})-(arm64-v8a|universal|x86_64)-(nightly|release)-([0-9a-f]{8})\.apk$/\1 \4/p' \
            | sort -u -r)

          if [ "${#PREV[@]}" -gt 0 ]; then
            {
              echo "## 🕘 历史构建(新 → 旧)"
              echo
            } >> "$BODY"
            n=0
            for row in "${PREV[@]}"; do
              if [ "$n" -ge 6 ]; then break; fi
              pts="${row%% *}"
              psha="${row##* }"
              pd="${pts:0:4}-${pts:4:2}-${pts:6:2} ${pts:9:2}:${pts:11:2}"
              links=""
              for abi in arm64-v8a universal x86_64; do
                links="${links}[\`${abi}\`](${BASE}/app-${pts}-${abi}-release-${psha}.apk) "
              done
              echo "- **${pd}** · \`${psha}\` — ${links}" >> "$BODY"
              n=$((n + 1))
            done
            echo >> "$BODY"
          fi

          {
            echo "---"
            echo
            echo "文件名规则 = \`app-<构建时间>-<架构>-${CHANNEL}-<短号>.apk\`（第三段为渠道标记）。"
            echo "下方 **Assets 列表由 GitHub 按上传时间(旧 → 新)排列,无法调整** —— 故请以上方表格为准下载最新构建。"
          } >> "$BODY"

          echo "=== 生成的 release 说明 ==="
          cat "$BODY"

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压。
      # tag 固定 nightly 只保留一条「最新构建」入口；文件名带短提交号所以 asset 不断追加、不覆盖。
      # 说明用 body_path 传入（动态生成、最新在前），见上一步。
      # tag / 名称 / 是否预发布全部取自 Resolve release target —— 正式版不再写进 nightly 入口。
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: success()
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          body_path: release_body.md
          files: app/build/outputs/apk/release/*.apk

      # 保留最近 6 次构建的产物，其余删除。
      #
      # ⚠️ 为什么不用「总数 - 18」计数法（2026-09-10 重构）：
      #   计数法基于**某一时刻的快照**算 to_delete，并发构建时两次运行的快照不同，
      #   叠加后会**多删**（A 见 24 个→删 6；B 见 21 个→再删 3；最终只剩 15 个而非 18 个）；
      #   且重复删除同一 asset 会返回 404 → xargs 退出码非 0 → 整个步骤**误报失败**。
      #
      # ✅ 现改为**幂等的不变式**：「按构建时间保留最新 6 组，删除其余」。
      #   性质：① 无论并发如何交错，都收敛到同一稳态（跑第二遍不会再多删）；
      #        ② **最新构建必然落在保留集内 → 永不删到更新的产物**（计数法无此保证）；
      #        ③ 重复删除按 404 容忍，不再导致步骤失败。
      - name: Cleanup old assets (keep latest 6 builds)
        # nightly 与尝鲜版各自一个固定 tag，两边都按「保留最新 6 组」清理。
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          sleep 30   # 等本次上传的 asset 在 API 中可见

          # 一次性取出全部 asset 的 (id, name)：只取一次，避免两次请求快照不一致
          mapfile -t ASSETS < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases/tags/${TARGET_TAG}" \
            --jq '.assets[] | select(.name | test("-[0-9a-f]{8}\\.apk$")) | [.id, .name] | @tsv')
          echo "匹配命名规则的 asset 共 ${#ASSETS[@]} 个"

          # 从文件名解析「构建键」= "构建时间戳 短号"；旧命名解析不出键 → 视为待清理
          key_of() {
            sed -nE 's/^app-([0-9]{8}-[0-9]{4})-(arm64-v8a|universal|x86_64)-(nightly|release)-([0-9a-f]{8})\.apk$/\1 \4/p' <<< "$1"
          }

          KEYS_FILE="$(mktemp)"
          while IFS=$'\t' read -r _id name; do
            [ -n "$name" ] || continue
            key_of "$name"
          done < <(printf '%s\n' "${ASSETS[@]}") | sort -u -r > "$KEYS_FILE"

          # 保留集 = 构建时间最新的 6 组（"时间戳 短号" 降序 → 最新在前）
          declare -A KEEP=()
          kept=0
          while read -r k; do
            [ -n "$k" ] || continue
            if [ "$kept" -ge 6 ]; then break; fi
            KEEP["$k"]=1
            kept=$((kept + 1))
          done < "$KEYS_FILE"
          echo "保留最新 $kept 组构建：$(tr '\n' ' ' < "$KEYS_FILE" | cut -c1-200)"

          # 删除集 = 不在保留集内的 asset（含解析不出构建键的旧命名）
          deleted=0
          failed=0
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            k="$(key_of "$name")"
            if [ -n "$k" ] && [ -n "${KEEP[$k]:-}" ]; then
              continue
            fi
            if gh api -X DELETE -H "Accept: application/vnd.github+json" \
                 "repos/${{ github.repository }}/releases/assets/$id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < <(printf '%s\n' "${ASSETS[@]}")
          rm -f "$KEYS_FILE"

          echo "已删除 $deleted 个旧 asset"
          if [ "$failed" -gt 0 ]; then
            echo "::notice::$failed 个 asset 删除失败（并发下被另一次运行抢先删除会返回 404，属正常，不影响收敛结果）"
          fi
