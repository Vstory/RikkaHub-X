name: Daily Build

on:
  # 每天 UTC 09:00、18:00 触发（北京时间 17:00、次日 02:00）
  schedule:
    - cron: '0 9,18 * * *'
  # 也支持手动触发
  workflow_dispatch:

# 供应链加固(2026-09-09):第三方 action 全部 pin 到 commit SHA,
# 避免可变 tag 被上游改动/账号被盗后投毒。
# 2026-09-09 第二次加固:Node.js 20 弃用警告,action 大版本整体升级到 node24 runtime:
#   actions/checkout            v4->v7   3d3c42e5
#   actions/setup-java          v4->v6   de7274f0
#   actions/setup-node          v4->v7   82076278
#   actions/cache               v4->v6   55cc8345
#   pnpm/action-setup           v4->v6   ea17c68d
#   softprops/action-gh-release v2->v3   efb35369

# 同一时间只跑一个构建，避免并发往同一个 nightly release 上传/清理造成冲突
concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            # 有正式签名 secrets：解码keystore、写签名配置、写Google Services
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            # 无 secrets（fork 自用构建）：用临时 keytool 签名 + 占位 google-services.json，
            # 产物可安装但为开发签名，不依赖 Firebase
            echo "无签名 secrets，使用临时开发签名构建（不接 Firebase）"
            keytool -genkeypair -v -keystore app/app.key -storepass android \
              -alias rikkahub -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=RikkaHub Dev,O=RikkaHub,C=CN" >/dev/null 2>&1
            echo "storeFile=${GITHUB_WORKSPACE}/app/app.key" > local.properties
            echo "storePassword=android" >> local.properties
            echo "keyAlias=rikkahub" >> local.properties
            echo "keyPassword=android" >> local.properties
            cp .github/google-services.placeholder.json app/google-services.json
          fi

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      # 计算短提交号，用于 APK 命名区分每次构建
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      # 把 APK 重命名追加短提交号 → 文件名带构建版本，同名不再互相覆盖，
      # 历史构建产物一直保留在 release 里，可随时回头下载测试
      - name: Rename APKs with commit hash
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            base="${f%.apk}"
            mv "$f" "${base}-${{ steps.sha.outputs.short }}.apk"
          done
          ls -l

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压。
      # tag 固定 nightly 只保留一条「最新构建」入口；文件名带短提交号所以 asset 不断追加、不覆盖
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: success()
        with:
          tag_name: nightly            # 固定 tag 保持下载入口稳定
          name: Nightly Build
          prerelease: true
          body: |
            自动每日构建（commit `${{ github.sha }}`，短号 `${{ steps.sha.outputs.short }}`）

            按文件名末尾的短提交号区分每次构建版本：
            - 真机 arm64 手机 → `app-arm64-v8a-release-<短号>.apk`
            - 通用包（所有架构，体积最大）→ `app-universal-release-<短号>.apk`
            - 模拟器 / x86_64 → `app-x86_64-release-<短号>.apk`

            > ⚠️ 开发版本，可能不稳定，仅供测试。
          files: app/build/outputs/apk/release/*.apk

      # 只保留最近 6 次构建的产物（6 组 × 3 ABI = 18 个带短号 asset），防止 release 无限膨胀。
      # 先休眠等新 asset 落库；无后缀的旧格式文件不在命名规则内、永不清理（不影响累积，可手动删）
      - name: Cleanup old nightly assets (keep latest 6 builds)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          # 按 uploaded_at 升序列出所有带 8 位短号后缀的 asset
          mapfile -t assets < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/releases/tags/nightly \
            --jq '.assets[] | select(.name | test("release-[0-9a-f]{8}\\.apk$")) | [.id, .uploaded_at, .name] | @tsv')
          echo "匹配命名规则的 asset 总数: ${#assets[@]}"
          # 总数超过 18 时，删掉最旧的 (总数-18) 个
          to_delete=$(( ${#assets[@]} - 18 ))
          if [ "$to_delete" -gt 0 ]; then
            # 按上传时间排序（第2列），取最旧的前 to_delete 个删除
            printf '%s\n' "${assets[@]}" \
              | sort -k2 \
              | head -n "$to_delete" \
              | cut -f1 \
              | xargs -r -n1 gh api -X DELETE \
                  -H "Accept: application/vnd.github+json" \
                  repos/${{ github.repository }}/releases/assets/{}
            echo "已清理 $to_delete 个旧 asset，保留最近 18 个（6 次构建）"
          else
            echo "未超上限，无需清理"
          fi
