name: Daily Build

# run 标题(2026-09-10):本 workflow 仅手动触发,默认标题就是 workflow 名,
# 多跑几次同样分不清批次;带上构建类型与分支后可辨认。
run-name: "Daily Build · ${{ inputs.build_type || 'nightly' }} · ${{ github.ref_name }}"

on:
  # 2026-09-10:定时自动构建已停用(注释掉 schedule),仅保留手动触发。
  # 原因:不再需要按时间自动打包,历史凌晨自动构建积累大量重复 APK。
  # 如需恢复定时构建,取消下面两行注释即可。
  # schedule:
  #   - cron: '0 9,18 * * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型: nightly=随机临时签名测试版(默认) / release=正式固定签名(需配置 KEY_BASE64 等 secrets)'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

# 供应链加固(2026-09-09):第三方 action 全部 pin 到 commit SHA,
# 避免可变 tag 被上游改动/账号被盗后投毒。
# 2026-09-09 第二次加固:Node.js 20 弃用警告,action 大版本整体升级到 node24 runtime:
#   actions/checkout            v4->v7   3d3c42e5
#   actions/setup-java          v4->v6   de7274f0
#   actions/setup-node          v4->v7   82076278
#   actions/cache               v4->v6   55cc8345
#   pnpm/action-setup           v4->v6   ea17c68d
#   softprops/action-gh-release v2->v3   efb35369

# 并发：**不设 concurrency 锁**（2026-09-10 移除）。
# 原先用 concurrency.group 强制串行，理由是"避免并发往同一个 nightly release
# 上传/清理冲突"。但那是**用锁掩盖脚本竞态**——正确做法是让脚本本身幂等：
#   - Cleanup 改为「保留最新 6 组构建」的不变式，任何交错都收敛到同一稳态，
#     且永不删到更新的产物（详见该步骤注释）
#   - 重复删除按 404 容忍，不再使步骤误报失败
# 故并发构建现在是安全的，无需人为排队（GitHub 默认本就允许并行）。

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'nightly' }}"
          if [ "$BUILD_TYPE" = "release" ] && [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            # 正式构建(release)且已提供密钥:解码正式 keystore → 固定正式签名,接真实 Firebase
            echo "正式构建:使用正式密钥固定签名(commit ${{ github.sha }})"
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
          else
            # 其余(nightly 默认 / 未提供密钥):每次构建生成一次性随机临时 keystore 签名。
            # 随机口令 + 随机 dname → 每次产物签名指纹不同,仅供测试分发,升级需重装。
            # (即使仓库配了密钥,只要没主动选 release,仍走随机签名——2026-09-10 用户确认)
            # 注意:keytool 生成时【不要】单独 -keypass,JKS 中 key 密码默认=store 密码;
            # 若 keypass≠storepass,AGP 用 storePassword 解 key 会报 "Given final block not properly padded"。
            echo "nightly 构建:每次随机临时签名(commit ${{ github.sha }})"
            SP="$(openssl rand -hex 16)"
            DN="CN=RikkaHubX Nightly $(date +%s), O=RikkaHubX Dev, C=CN"
            keytool -genkeypair -v -keystore app/app.key \
              -storepass "$SP" \
              -alias rikkahub \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -dname "$DN" >/dev/null 2>&1
            echo "storeFile=${GITHUB_WORKSPACE}/app/app.key" > local.properties
            echo "storePassword=$SP" >> local.properties
            echo "keyAlias=rikkahub" >> local.properties
            echo "keyPassword=$SP" >> local.properties
            cp .github/google-services.placeholder.json app/google-services.json
          fi

      # 计算短提交号与构建时间戳(北京时间)。须在构建**之前**完成 —— 时间戳要作为
      # -Px.build.info 传给 Gradle,用于 versionCode 与 versionName(见 app/build.gradle.kts)。
      # APK 文件名 / versionCode / versionName 三处时间必须一致,故三者取自**同一次 date 调用**,
      # 否则临近分钟或跨日边界时三处会不一致:
      #   info = "<epoch 秒>|<yyMMdd>|<8 位短哈希>"
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        id: ts
        run: |
          NOW=$(date +%s)
          echo "ts=$(TZ=Asia/Shanghai date -d "@$NOW" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "info=$NOW|$(TZ=Asia/Shanghai date -d "@$NOW" +%y%m%d)|${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Px.build.info="${{ steps.ts.outputs.info }}"

      # 把 APK 重命名：文件名带「构建时间(北京时间)+短提交号」。
      # 时间戳放前部便于肉眼按时间辨认，同一次构建的三包相邻；短号用于对应 commit。
      # ⚠️ 注意：GitHub **不支持**控制 release 资产显示顺序 —— 资产列表始终按上传顺序
      #    (旧→新)排列，文件名排序无法改变它(softprops/action-gh-release 文档明确：
      #    "does not control the final asset ordering")。
      #    故「最新构建置顶」改由 release 说明(body)实现 —— 见下方 Generate release body。
      # 例：app-20260910-0215-arm64-v8a-release-a1b2c3d4.apk
      - name: Rename APKs with build time & commit hash
        run: |
          cd app/build/outputs/apk/release
          for f in *.apk; do
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            mv "$f" "app-${{ steps.ts.outputs.ts }}-${abi}-release-${{ steps.sha.outputs.short }}.apk"
          done
          ls -l

      # 生成 release 说明(新 → 旧)。
      # 为什么要有这一步：GitHub 的 release 资产列表**固定按上传顺序(旧→新)**显示，
      # 且没有 API/设置可以调整(见 Rename 步骤注释)。而说明(body)渲染在资产列表**上方**，
      # 所以把「最新构建」的直链做成表格放说明里 → 打开 release 页第一眼就是最新产物。
      # 历史构建按时间**倒序**列出(最多 6 次)，同样新在上。
      - name: Generate release body (newest first)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TS="${{ steps.ts.outputs.ts }}"
          SHA="${{ steps.sha.outputs.short }}"
          BASE="https://github.com/${REPO}/releases/download/nightly"
          # 时间戳 20260910-0925 → 可读 2026-09-10 09:25
          PRETTY="${TS:0:4}-${TS:4:2}-${TS:6:2} ${TS:9:2}:${TS:11:2}"

          abi_label() {
            case "$1" in
              arm64-v8a) echo "真机(绝大多数手机)" ;;
              universal) echo "通用包(所有架构,体积最大)" ;;
              x86_64)    echo "模拟器 / x86_64" ;;
            esac
          }

          BODY="${GITHUB_WORKSPACE}/release_body.md"
          cd app/build/outputs/apk/release

          {
            # 免责声明：nightly 页面会被搜到/被直接下载，必须在最顶部劝退非开发者
            echo "> [!WARNING]"
            echo "> **本页面的 APK 仅供开发者测试功能使用。功能不稳定,请不要下载。**"
            echo
            echo "自动构建 · commit \`${{ github.sha }}\`(短号 \`${SHA}\`)"
            echo
            echo "## 📥 最新构建 · ${PRETTY}(北京时间)"
            echo
            echo "| 架构 | 适用 | 下载 |"
            echo "|---|---|---|"
            for abi in arm64-v8a universal x86_64; do
              f="app-${TS}-${abi}-release-${SHA}.apk"
              if [ -f "$f" ]; then
                mb="$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.1f", b/1048576}')"
                echo "| \`${abi}\` | $(abi_label "$abi") | [⬇ 下载 ${mb} MB](${BASE}/${f}) |"
              fi
            done
            echo
            echo "> ⚠️ nightly 为**随机临时签名**,每次构建签名不同 → 安装前请先**卸载旧版**(不能覆盖升级)。"
            echo
          } > "$BODY"

          # 历史构建：从已有 asset 名解析出 (时间戳, 短号)，去重后倒序 → 新在上
          mapfile -t PREV < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/releases/tags/nightly" \
            --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/^app-([0-9]{8}-[0-9]{4})-(arm64-v8a|universal|x86_64)-release-([0-9a-f]{8})\.apk$/\1 \3/p' \
            | sort -u -r)

          if [ "${#PREV[@]}" -gt 0 ]; then
            {
              echo "## 🕘 历史构建(新 → 旧)"
              echo
            } >> "$BODY"
            n=0
            for row in "${PREV[@]}"; do
              if [ "$n" -ge 6 ]; then break; fi
              pts="${row%% *}"
              psha="${row##* }"
              pd="${pts:0:4}-${pts:4:2}-${pts:6:2} ${pts:9:2}:${pts:11:2}"
              links=""
              for abi in arm64-v8a universal x86_64; do
                links="${links}[\`${abi}\`](${BASE}/app-${pts}-${abi}-release-${psha}.apk) "
              done
              echo "- **${pd}** · \`${psha}\` — ${links}" >> "$BODY"
              n=$((n + 1))
            done
            echo >> "$BODY"
          fi

          {
            echo "---"
            echo
            echo "文件名规则 = \`app-<构建时间>-<架构>-release-<短号>.apk\`。"
            echo "下方 **Assets 列表由 GitHub 按上传时间(旧 → 新)排列,无法调整** —— 故请以上方表格为准下载最新构建。"
          } >> "$BODY"

          echo "=== 生成的 release 说明 ==="
          cat "$BODY"

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压。
      # tag 固定 nightly 只保留一条「最新构建」入口；文件名带短提交号所以 asset 不断追加、不覆盖。
      # 说明用 body_path 传入（动态生成、最新在前），见上一步。
      - name: Publish nightly prerelease
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: success()
        with:
          tag_name: nightly            # 固定 tag 保持下载入口稳定
          name: Nightly Build
          prerelease: true
          body_path: release_body.md
          files: app/build/outputs/apk/release/*.apk

      # 保留最近 6 次构建的产物，其余删除。
      #
      # ⚠️ 为什么不用「总数 - 18」计数法（2026-09-10 重构）：
      #   计数法基于**某一时刻的快照**算 to_delete，并发构建时两次运行的快照不同，
      #   叠加后会**多删**（A 见 24 个→删 6；B 见 21 个→再删 3；最终只剩 15 个而非 18 个）；
      #   且重复删除同一 asset 会返回 404 → xargs 退出码非 0 → 整个步骤**误报失败**。
      #
      # ✅ 现改为**幂等的不变式**：「按构建时间保留最新 6 组，删除其余」。
      #   性质：① 无论并发如何交错，都收敛到同一稳态（跑第二遍不会再多删）；
      #        ② **最新构建必然落在保留集内 → 永不删到更新的产物**（计数法无此保证）；
      #        ③ 重复删除按 404 容忍，不再导致步骤失败。
      - name: Cleanup old nightly assets (keep latest 6 builds)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30   # 等本次上传的 asset 在 API 中可见

          # 一次性取出全部 asset 的 (id, name)：只取一次，避免两次请求快照不一致
          mapfile -t ASSETS < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/releases/tags/nightly \
            --jq '.assets[] | select(.name | test("-[0-9a-f]{8}\\.apk$")) | [.id, .name] | @tsv')
          echo "匹配命名规则的 asset 共 ${#ASSETS[@]} 个"

          # 从文件名解析「构建键」= "构建时间戳 短号"；旧命名解析不出键 → 视为待清理
          key_of() {
            sed -nE 's/^app-([0-9]{8}-[0-9]{4})-(arm64-v8a|universal|x86_64)-release-([0-9a-f]{8})\.apk$/\1 \3/p' <<< "$1"
          }

          KEYS_FILE="$(mktemp)"
          while IFS=$'\t' read -r _id name; do
            [ -n "$name" ] || continue
            key_of "$name"
          done < <(printf '%s\n' "${ASSETS[@]}") | sort -u -r > "$KEYS_FILE"

          # 保留集 = 构建时间最新的 6 组（"时间戳 短号" 降序 → 最新在前）
          declare -A KEEP=()
          kept=0
          while read -r k; do
            [ -n "$k" ] || continue
            if [ "$kept" -ge 6 ]; then break; fi
            KEEP["$k"]=1
            kept=$((kept + 1))
          done < "$KEYS_FILE"
          echo "保留最新 $kept 组构建：$(tr '\n' ' ' < "$KEYS_FILE" | cut -c1-200)"

          # 删除集 = 不在保留集内的 asset（含解析不出构建键的旧命名）
          deleted=0
          failed=0
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            k="$(key_of "$name")"
            if [ -n "$k" ] && [ -n "${KEEP[$k]:-}" ]; then
              continue
            fi
            if gh api -X DELETE -H "Accept: application/vnd.github+json" \
                 "repos/${{ github.repository }}/releases/assets/$id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < <(printf '%s\n' "${ASSETS[@]}")
          rm -f "$KEYS_FILE"

          echo "已删除 $deleted 个旧 asset"
          if [ "$failed" -gt 0 ]; then
            echo "::notice::$failed 个 asset 删除失败（并发下被另一次运行抢先删除会返回 404，属正常，不影响收敛结果）"
          fi
