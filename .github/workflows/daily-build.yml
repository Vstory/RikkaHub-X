name: Daily Build

# run 标题(2026-09-10 引入,2026-09-12 改):本 workflow 仅手动触发,默认标题就是 workflow 名,
# 多跑几次分不清批次;带上渠道与分支后可辨认。
#
# 渠道名用与 Release 页面**同一套词汇**(Nightly Build / Release Build),而不是裸的
# `nightly` / `release` —— 后者只差一个词,列表里扫一眼容易看串;且 `release` 在别处既指
# 构建类型、又指 AGP 变体名,单独出现有歧义。改成页面名后,运行标题与它产出的页面可互相检索。
# ⚠️ `A && B || C` 是 GitHub 官方的三目写法(文档「Evaluate expressions」明确给出),但有个前提:
#    **B 必须为真值** —— 否则会静默落到 C。这里 B 是非空字符串 'Release Build',恒为真,故安全。
#    将来若把 B 改成可能为空/为 false 的值(如 '')，这个写法会失效,须改用别的结构。
run-name: "Daily Build · ${{ inputs.build_type == 'release' && 'Release Build' || 'Nightly Build' }} · ${{ github.ref_name }}"

on:
  # 2026-09-10:定时自动构建已停用(注释掉 schedule),仅保留手动触发。
  # 原因:不再需要按时间自动打包,历史凌晨自动构建积累大量重复 APK。
  # 如需恢复定时构建,取消下面两行注释即可。
  # schedule:
  #   - cron: '0 9,18 * * *'
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型: nightly=测试版(独立包名 .nightly,与正式版同签名,可共存) / release=正式版'
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

# 供应链加固(2026-09-09):第三方 action 全部 pin 到 commit SHA,
# 避免可变 tag 被上游改动/账号被盗后投毒。
# 2026-09-09 第二次加固:Node.js 20 弃用警告,action 大版本整体升级到 node24 runtime:
#   actions/checkout            v4->v7   3d3c42e5
#   actions/setup-java          v4->v6   de7274f0
#   actions/setup-node          v4->v7   82076278
#   actions/cache               v4->v6   55cc8345
#   pnpm/action-setup           v4->v6   ea17c68d
#   softprops/action-gh-release v2->v3   efb35369

# 并发：**不设 concurrency 锁**（2026-09-10 移除）。
# 原先用 concurrency.group 强制串行，理由是"避免并发往同一个 nightly release
# 上传/清理冲突"。但那是**用锁掩盖脚本竞态**——正确做法是让脚本本身幂等：
#   - Cleanup 改为「保留最新 6 组构建」的不变式，任何交错都收敛到同一稳态，
#     且永不删到更新的产物（详见该步骤注释）
#   - 重复删除按 404 容忍，不再使步骤误报失败
# 故并发构建现在是安全的，无需人为排队（GitHub 默认本就允许并行）。

jobs:
  # 检查过去 24 小时内是否有新提交，没有则跳过构建，避免重复打包
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check for recent commits
        id: check
        run: |
          # 手动触发时无条件构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发：仅当过去 24 小时内有新提交才构建
          if [ -n "$(git log --since='24 hours ago' --oneline)" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "过去 24 小时无新提交，跳过构建"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive # 拉取子模块

      # release 必须基于 main 的最新代码 —— 两条断言都放在编译之前（失败只花几秒）：
      #   ① 触发 ref 必须是 main：workflow_dispatch 允许挑任意分支/标签，从特性分支误触发
      #      会把非 main 代码打成正式包直接发到 release 页面；
      #   ② 检出的提交必须就是 main 当前的 HEAD：检出用的是**派发时**解析的 SHA，若 main 在
      #      「派发 → 检出」之间前进，构建出的就是稍旧的提交。该窗口通常只有几秒，故几乎不会
      #      触发；一旦触发即说明用的确实不是最新代码，宁可报错也不静默构建旧代码。
      # nightly 不受这两条约束 —— 从特性分支出测试包是既定用法（见发布流程「特性分支」）。
      - name: Guard release to main's latest commit
        if: github.event.inputs.build_type == 'release'
        run: |
          echo "触发 ref: ${GITHUB_REF}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::release 只能从 main 触发,当前是 ${GITHUB_REF}"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "${HEAD_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::main 已前进(检出 ${HEAD_SHA:0:8},main 现在 ${MAIN_SHA:0:8}),请重新触发"
            exit 1
          fi
          echo "✅ release 基于 main 最新提交 ${HEAD_SHA:0:8}"

      # X 定制:产物命名自检 —— 刻意放在编译之前,失败只花几秒(本地实测 0.4 秒)。
      #
      # 为什么必须在这一步兜底:命名规则散在**本文件的五处**(重命名 / 正文「最新构建」/
      # 正文「历史构建」解析 / 清理 jq 匹配 / 清理 key_of),任一处漏改都是**静默错** ——
      # 链接 404、历史列表整段消失、旧资产永不被清理、或资产被误删。而本文件不在任何
      # CI 的 paths 过滤内(Compile Check 只管 app/src/**,Guard 只管它自己列的文件),
      # 只改它不会触发任何工作流,只能等下次构建才暴露 —— 2026-09-12 的下载链接整段 404
      # 就是这么漏过去的。
      #
      # 脚本会用 strings.xml 里的**真实应用名**构造样例资产名,再喂给本工作流里的
      # sed / jq 表达式真跑一遍,所以「改应用名导致前缀变化」也会在这里被拦住。
      - name: Verify APK naming rules are self-consistent
        run: python3 scripts/check_x_apk_naming.py

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      # gradle 的 buildWebUi 任务只跑 build 不跑 install，需在此提前安装依赖
      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        env:
          # ⚠️ secret 一律经 env 传入、脚本里只引用变量名，**不把值插进 run 脚本文本**。
          #    理由：值里若含 $ 或反引号，插进脚本会被 shell 二次展开。
          #    实测正式 keystore 的口令里就有 $，旧写法（echo "${{ secrets.X }}"）
          #    会把口令吃掉一截，而且在签名报错之前没有任何提示。
          X_KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          X_SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          X_SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          X_SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'nightly' }}"

          # ⚠️ **两种构建都用同一把正式密钥**(2026-09-13 用户定:nightly 与正式版一个签名)。
          #
          # 为什么这件事值:随机签名的 nightly **每次构建签名都不同**,于是每次装都要先卸载
          # (数据全丢)。改用固定密钥后,**连续两次 nightly 之间可以直接覆盖升级** ——
          # 这正是「测试包」最该有的性质。
          #
          # ⚠️ 代价(写在这里,免得后来人以为是漏了):nightly 不再有「随便哪个分支都能出包」
          #    的便利 —— 它现在**必须**有正式密钥的 secrets,而 nightly 可以从任意分支触发
          #    (release 那条 `refs/heads/main` 的守卫**不**管它)。真要止损就轮换密钥。
          #
          # 缺 secret → **直接失败**,不静默回退到随机签名:那会让产物看着"构建成功"、
          # 签名却不对,而用户要等安装时才发现升不了级。
          missing=""
          for v in X_KEY_BASE64 X_SIGNING_STORE_PASSWORD X_SIGNING_KEY_ALIAS X_SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "❌ 缺少签名密钥:$missing"
            echo "   nightly 与 release 用同一把密钥,故两者都需要它。"
            echo "   拒绝回退到随机签名 —— 那会让产物与后续包无法互相覆盖安装。"
            exit 1
          fi

          echo "使用固定正式密钥签名(channel=${BUILD_TYPE}, commit ${{ github.sha }})"
          printf '%s' "$X_KEY_BASE64" | base64 -d > app/app.key
          # storeFile 由 runner 现场拼（GITHUB_WORKSPACE）—— 不写死仓库在 runner 上的路径名，
          # 改名/换布局都不会失配。
          printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/app/app.key" > local.properties
          printf 'storePassword=%s\n' "$X_SIGNING_STORE_PASSWORD" >> local.properties
          printf 'keyAlias=%s\n' "$X_SIGNING_KEY_ALIAS" >> local.properties
          printf 'keyPassword=%s\n' "$X_SIGNING_KEY_PASSWORD" >> local.properties
          # ⚠️ 这里原先还写两份 `google-services.json`(正式版写 secret、nightly 拷占位文件)
          #    —— Firebase 于 2026-09-13 整体移除,`google-services` 插件也不在了,
          #    故那两行与 `GOOGLE_SERVICES_JSON` secret 都成了死代码,一并删掉。

      # 计算短提交号与构建时间戳(北京时间)。须在构建**之前**完成 —— 时间戳要作为
      # -Px.build.info 传给 Gradle,用于 versionCode 与 versionName(见 app/build.gradle.kts)。
      # APK 文件名 / versionCode / versionName 三处时间必须一致,故三者取自**同一次 date 调用**,
      # 否则临近分钟或跨日边界时三处会不一致:
      #   info = "<epoch 秒>|<yyMMdd>|<8 位短哈希>"
      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      # ⚠️ 分支名可能**带斜杠**(`diag/consolidate`),而 artifact 名字**不许有斜杠**
      # —— GitHub 为跨文件系统兼容而禁掉了 `/ \ : * ? " < > |`。
      # 故凡是拿分支名去拼 artifact 名的地方,一律用它。
      #
      # 这个坑 2026-09-13 实测踩到:那一步是 `692f4c7b` 加的,而 nightly 只能**手动**触发
      # —— 之后一直没人跑过 Daily Build,于是它坏了整整一天而「看板上全绿」。
      # 又一次印证那条:**看板绿 ≠ 真的验过**(带 paths 白名单、或只能手动触发的工作流,
      # 都可能让一步长期不执行)。
      - name: Slugify ref name
        id: refslug
        run: echo "slug=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr -cd 'A-Za-z0-9._-')" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        id: ts
        run: |
          NOW=$(date +%s)
          echo "ts=$(TZ=Asia/Shanghai date -d "@$NOW" +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "info=$NOW|$(TZ=Asia/Shanghai date -d "@$NOW" +%y%m%d)|${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          # -Px.channel:应用名按渠道取值(nightly 追加后缀,见 app/build.gradle.kts)。
          # 与 release 说明里的渠道口径同源 —— 都取 build_type,默认 nightly。
          ./gradlew assembleRelease \
            -Px.build.info="${{ steps.ts.outputs.info }}" \
            -Px.channel="${{ github.event.inputs.build_type || 'nightly' }}"

      # 把 APK 重命名：文件名带「构建时间(北京时间)+短提交号」。
      # 时间戳放前部便于肉眼按时间辨认，同一次构建的三包相邻；短号用于对应 commit。
      # ⚠️ 注意：GitHub **不支持**控制 release 资产显示顺序 —— 资产列表始终按上传顺序
      #    (旧→新)排列，文件名排序无法改变它(softprops/action-gh-release 文档明确：
      #    "does not control the final asset ordering")。
      #    故「最新构建置顶」改由 release 说明(body)实现 —— 见下方 Generate release body。
      # 例：RikkaHub.X.Nightly_20260910-0215_arm64-v8a_nightly_a1b2c3d4.apk（前缀 = 应用名空白折点）
      - name: Rename APKs with build time & commit hash
        env:
          # 文件名第三段标出**渠道**（nightly / release），不再是 AGP 的构建变体名 ——
          # 原先一律写 `release`（AGP 输出 `app-release.apk` 的变体名），于是 nightly 页面上
          # 的产物也叫 `…-release-….apk`，在页面与资产列表里看着像一个正式包。
          CHANNEL: ${{ github.event.inputs.build_type || 'nightly' }}
        run: |
          [ "$CHANNEL" = "release" ] || CHANNEL=nightly
          # 产物名前缀取**应用名**，与 strings.xml 的 app_name / app_name_nightly 同源
          # （在这里现读，避免"应用名"存在第二份来源、改一处忘一处）。
          # ⚠️ 取来后要把**空白折成一个点** —— 这正是平台在上传时本就会做的改写：
          #    GitHub 会把资产名里的空格改成点（实测 2026-09-12：本地名
          #    `RikkaHub X Nightly_….apk` 在资产列表与 URL 里都成了 `RikkaHub.X.Nightly_….apk`）。
          #    若本地名保留空格，按它拼出的下载链接就必然 404 —— 页面「最新构建」那一格
          #    曾整段坏掉，而「历史构建」因为是按 API 返回的**真实资产名**反解、反倒正常。
          #    这里提前折点，让本地名与真实资产名**从一开始就一致**，链接直接拼即可，
          #    也就不必再做 %20 编码。
          #    选折点而非去空格：与已上传的历史资产格式相同，新旧名字之间没有过渡期。
          LABEL_RELEASE="$(sed -nE 's/.*<string name="app_name">([^<]+)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -1)"
          LABEL_NIGHTLY="$(sed -nE 's/.*<string name="app_name_nightly">([^<]+)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -1)"
          if [ -z "$LABEL_RELEASE" ] || [ -z "$LABEL_NIGHTLY" ]; then
            echo "❌ 读不到应用名（strings.xml 的 app_name / app_name_nightly），拒绝用空前缀给产物命名"
            exit 1
          fi
          # 应用名 → 产物名前缀：去掉首尾空白，再把中间的空白(含连续)折成一个点。
          # 于是 `RikkaHub X` → `RikkaHub.X`、`RikkaHub X Nightly` → `RikkaHub.X.Nightly`。
          to_prefix() {
            printf '%s' "$1" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/./g'
          }
          LABEL_RELEASE="$(to_prefix "$LABEL_RELEASE")"
          LABEL_NIGHTLY="$(to_prefix "$LABEL_NIGHTLY")"
          # 折完再守一道：万一应用名里出现别的 URL 不友好字符，宁可在此失败，
          # 也不要产出一个「页面能看、链接打不开」的名字。
          for _p in "$LABEL_RELEASE" "$LABEL_NIGHTLY"; do
            case "$_p" in
              ""|*[!A-Za-z0-9._-]*|.*|*.)
                echo "❌ 折点后的产物名前缀为空或含非法字符/以点开头结尾：'$_p'（仅允许字母/数字/._-）"
                exit 1
                ;;
            esac
          done
          if [ "$CHANNEL" = "release" ]; then PREFIX="$LABEL_RELEASE"; else PREFIX="$LABEL_NIGHTLY"; fi
          echo "渠道标记: ${CHANNEL} · 产物名前缀: ${PREFIX}"
          cd app/build/outputs/apk/release
          for f in *.apk; do
            # 架构不再从前缀解析（前缀随渠道变），改按已知架构匹配；认不出即报错 ——
            # 否则新名字里架构段会静默变成空串，产物名残缺却照常发布。
            case "$f" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *x86_64*)    abi=x86_64 ;;
              *universal*) abi=universal ;;
              *) echo "❌ 无法从产物名识别架构：$f"; exit 1 ;;
            esac
            mv -- "$f" "${PREFIX}_${{ steps.ts.outputs.ts }}_${abi}_${CHANNEL}_${{ steps.sha.outputs.short }}.apk"
          done
          ls -l

      # X 定制:拿**实际产出的文件名**再断言一次 —— 用现实校验,不只信规则自洽。
      #
      # 2026-09-12 的下载链接 404 根因就在文件名上:本地名含空格,而平台在上传时会把空格
      # 改写成点,于是按本地名拼出的链接永远对不上真实资产名。思路同下面的
      # 「Verify signing certificate」:宁可不发,也不发一个用户点不开的包。
      #
      # 断言两件事:
      #   ① 数量不为 0 —— 空集会让循环整体跳过,变成「永远通过的检查」;
      #   ② 每个名字都符合文档规则 `前缀_时间_架构_渠道_短号.apk`,前缀只含 URL 安全字符
      #      (正则里的字符集与重命名那一步的白名单守卫保持一致)。
      - name: Assert APK file names match the documented rule
        run: |
          cd app/build/outputs/apk/release
          shopt -s nullglob
          apks=(*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "❌ 目录里没有任何 APK —— 拒绝发布(空集不能算通过)"
            exit 1
          fi
          bad=0
          for f in "${apks[@]}"; do
            if printf '%s' "$f" | grep -qE '^[A-Za-z0-9._-]+_[0-9]{8}-[0-9]{4}_(arm64-v8a|universal|x86_64)_(nightly|release)_[0-9a-f]{8}\.apk$'; then
              echo "  ✅ ${f}"
            else
              echo "  ❌ 与命名规则不符(或含空格 / 百分号等 URL 不友好字符):${f}"
              bad=1
            fi
          done
          if [ "${bad}" != "0" ]; then
            echo "❌ 拒绝发布:产物名不是 URL 安全的、或与文档规则不符。"
            echo "   规则见「Rename APKs with build time & commit hash」那一步的注释。"
            exit 1
          fi
          echo "✅ 产物名全部符合规则且 URL 安全(${#apks[@]} 个)"

      # 决定本次产物发到哪个 Release。两者**必须是不同的 Release**：共用同一个 tag 时，
      # 后一次构建的说明会整段覆盖前一次 —— 实测正式包的说明把 nightly 页面的免责声明刷掉了。
      #   nightly → 固定 tag `nightly`（下载入口稳定），预发布
      #   release → 独立 tag `v<基础版本>-x<序号>`，正式发布（非预发布）
      # 决定本次产物发到哪个 Release。两类构建各用**一个固定 tag**，下载入口长期稳定。
      # 两者必须是不同的 Release：共用同一个 tag 时，后一次构建的说明会整段覆盖前一次 ——
      # 实测正式包的说明把 nightly 页面的免责声明刷掉了。
      #   nightly → tag `nightly`，独立包名 `…x.nightly` + **与正式版同一把密钥**，
      #             故连续两次 nightly 之间可直接覆盖升级（装前不必卸载）
      #   release → tag `release`（页面名 `Release Build`），固定密钥签名（可直接覆盖升级）
      # 两者都标记为预发布：本仓库是自用派生版本，不对外声称稳定正式版。
      - name: Resolve release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'nightly' }}"

          # 从**构建产物**读 versionName（权威）—— 两条渠道都要读，故两页显示的都是**本次构建
          # 产物自己的**版本号。versionName 形如 `2.5.1+<构建日期>.<提交短号>`，短号取自本次
          # 检出的 HEAD，故用不同代码构建时两页的版本号天然不同，不会互相覆盖。
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          AAPT2="$(command -v aapt2 || true)"
          for home in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$home" ] || continue
            [ -n "$AAPT2" ] && break
            AAPT2="$(ls -d "$home"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          done
          FULL=""
          if [ -n "$APK" ] && [ -n "$AAPT2" ]; then
            FULL="$("$AAPT2" dump badging "$APK" 2>/dev/null \
              | sed -nE "s/^package:.*versionName='([^']+)'.*/\1/p" | head -1)"
          fi
          if [ -z "$FULL" ]; then
            # 兜底：aapt2 不可用时读构建脚本的默认 versionName（X 定制把它拼成 <默认>+<日期>.<短号>）
            FULL="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
            echo "⚠️ aapt2 不可用或找不到产物，versionName 改从 app/build.gradle.kts 读取: ${FULL}"
          fi
          echo "版本: ${FULL:-（读不到）}"
          if [ "$BUILD_TYPE" != "release" ]; then
            {
              echo "tag=nightly"
              echo "name=Nightly Build"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "is_nightly=true"
              echo "channel=nightly"
              echo "version=${FULL}"
            } >> "$GITHUB_OUTPUT"
            echo "nightly → 固定 tag nightly（预发布，独立包名 + 与正式版同签名）"
            exit 0
          fi


          {
            echo "tag=release"
            echo "name=Release Build"
            echo "prerelease=true"
            echo "make_latest=false"
            echo "is_nightly=false"
            echo "channel=release"
            echo "version=${FULL}"
          } >> "$GITHUB_OUTPUT"
          echo "release → 固定 tag release（预发布，固定密钥签名）"

      # 断言产物确实由**固定密钥**签名，并把证书指纹传给发布说明。
      #
      # 为什么必须断言：AGP 在 signingConfig 为空时**不报错**，而是产出 app-release-unsigned.apk；
      # 而重命名用 `*.apk` 通配 → unsigned 包会连同正式包一起被发布，产物外观一切正常，
      # 装到手机上才发现升不了级。签名这种事一旦错了只在用户侧暴露，必须在构建期拦住。
      - name: Verify signing certificate
        if: success()
        env:
          EXPECTED_SHA256: EE96008F1B4C668D23463B8482C33ED6D429C7F76546FE433C7B3C6D27EA1A08
        run: |
          # ① 任何构建类型都不许出现未签名产物
          if ls app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "❌ 出现未签名产物，拒绝发布："
            ls -l app/build/outputs/apk/release/*unsigned*.apk
            exit 1
          fi

          # ⚠️ 这里原先对 nightly **跳过**签名断言(那时它按设计用随机签名、无固定指纹)。
          #    2026-09-13 起 nightly 与正式版**同一把密钥**,故断言对**两种构建一律生效**
          #    —— 而且更需要它了:nightly 出了签名事故(比如回退成随机签名)的话,
          #    表现是「装过一次之后再也升不上去」,而那要在用户侧才暴露。

          APKSIGNER="$(command -v apksigner || true)"
          for home in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$home" ] || continue
            [ -n "$APKSIGNER" ] && break
            APKSIGNER="$(ls -d "$home"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          done
          if [ -z "$APKSIGNER" ]; then
            echo "❌ 找不到 apksigner，无法断言签名 —— 拒绝发布。"
            echo "   已查：PATH、\$ANDROID_HOME、\$ANDROID_SDK_ROOT、/usr/local/lib/android/sdk"
            exit 1
          fi
          echo "使用 apksigner: ${APKSIGNER}"

          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "❌ 找不到 arm64-v8a 产物，无法验证签名"; exit 1; }

          # 指纹一律归一化成「去掉冒号的大写十六进制」再比对 —— 期望值不论写成
          # `EE:96:...` 还是 `ee96...` 都能对上，避免比对手工维护的字符串格式。
          norm() { tr -d ':\r\n' | tr 'a-f' 'A-F'; }

          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | norm)"
          EXPECTED="$(printf '%s' "$EXPECTED_SHA256" | norm)"

          echo "产物签名证书 SHA-256: ${ACTUAL:-（读不到）}"
          echo "固定密钥期望指纹  : ${EXPECTED}"

          # ⚠️ 先确认**真的读到了**指纹。否则「apksigner 解析失败 → ACTUAL 为空」会与
          #    「期望值为空」误判为相等 → 检查静默通过。读不到就必须拦住，不能算通过。
          case "$ACTUAL" in
            [0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F][0-9A-F]*) ;;
            *) echo "❌ 读不到签名证书指纹（apksigner 未能解析产物）—— 拒绝发布。"; exit 1 ;;
          esac
          if [ "${#ACTUAL}" -ne 64 ]; then
            echo "❌ 签名证书指纹长度异常（${#ACTUAL}，应为 64）—— 拒绝发布。"
            exit 1
          fi
          case "$EXPECTED" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "❌ 期望指纹未配置或长度异常（${#EXPECTED}）—— 拒绝发布。"; exit 1 ;;
          esac

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ 签名证书与固定密钥不一致 —— 产物不是用正式密钥签的，"
            echo "   发出去用户将无法覆盖升级。"
            exit 1
          fi
          echo "✅ 签名一致：产物由固定正式密钥签名"
          echo "CERT_SHA256=${ACTUAL}" >> "$GITHUB_ENV"

      # 断言**产物里的包名**与渠道相符(2026-09-13 加)。
      #
      # 为什么必须在**产物**上断言,而不是只看 build.gradle.kts:
      #   nightly 的独立包名是靠 `if (xChannel == "nightly") applicationIdSuffix = ".nightly"`
      #   实现的 —— 一旦那个条件被改坏(或 `-Px.channel` 没传对),**产物包名会静默变回正式版的**。
      #   两种后果都不好看,而构建日志里**没有任何异常**(编译 / 签名 / 命名全过):
      #     · nightly 覆盖到正式版上 → 用户以为在试新功能,其实把正式包替换掉了;
      #     · 正式版被带上 .nightly → 正式用户装不上更新(包名对不上)。
      #   签名那一步断言的是「身份的另一半」,两者合起来才保证「装得上、升得动」。
      - name: Assert package name matches the channel
        if: success()
        env:
          IS_NIGHTLY: ${{ steps.target.outputs.is_nightly }}
        run: |
          AAPT2="$(command -v aapt2 || true)"
          for home in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            [ -n "$home" ] || continue
            [ -n "$AAPT2" ] && break
            AAPT2="$(ls -d "$home"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          done
          # ⚠️ 这里**不许**像 versionName 那样兜底(build.gradle.kts 读默认值)——
          #    要断言的恰恰是「Gradle 的条件真的生效了」,读配置文件等于自己验自己。
          #    读不到就拒绝发布。
          if [ -z "$AAPT2" ]; then
            echo "❌ 找不到 aapt2，无法断言产物包名 —— 拒绝发布。"
            exit 1
          fi
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "❌ 找不到 arm64-v8a 产物，无法断言包名"; exit 1; }

          ACTUAL="$("$AAPT2" dump badging "$APK" 2>/dev/null \
            | sed -nE "s/^package: name='([^']+)'.*/\1/p" | head -1)"
          if [ "$IS_NIGHTLY" = "true" ]; then
            EXPECTED="me.rerere.rikkahub.x.nightly"
          else
            EXPECTED="me.rerere.rikkahub.x"
          fi
          echo "产物包名: ${ACTUAL:-（读不到）}"
          echo "期望包名: ${EXPECTED}"
          case "$ACTUAL" in
            me.rerere.rikkahub.*) ;;
            *) echo "❌ 读不到产物包名(aapt2 未能解析)—— 拒绝发布。"; exit 1 ;;
          esac
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ 包名与渠道不符 —— nightly 与正式版会互相覆盖,或正式版装不上更新。"
            exit 1
          fi
          echo "✅ 包名与渠道相符"

      # 断言**产物里没有 Firebase 运行时**(2026-09-13 加)。
      #
      # ⚠️ 判据是「运行时」而不是「没有 firebase 字样」—— 后者是**错的**,现场就被打脸:
      #    当前 APK 的 manifest 里有 6 处 `com.google.firebase.components:…BarcodeRegistrar`,
      #    **完全合法** —— 它们来自扫码库(`com.google.mlkit:barcode-scanning` 传递依赖
      #    firebase-components/encoders)。ML Kit 有**自己的**引导链
      #    (`MlKitInitProvider` + `MlKitComponentDiscoveryService`),只借用
      #    firebase-components 的组件系统,不需要 firebase-common。
      #
      # 故本步只拦**运行时**:`FirebaseApp` / `FirebaseInitProvider` /
      # `ComponentDiscoveryService` / crashlytics 包 / analytics 包,外加那几个 jar 的
      # 打包标记。ML Kit 的 helper 允许存在(会被打印出来,免得下次又被当成问题)。
      #
      # 它补的是 `check_x_manifest.py` 管不到的那一层:后者只看**构建输入**
      # (Manifest / 构建文件 / 源码),而 Firebase 完全可能通过**传递依赖**回到包里 ——
      # 那时构建输入一个 firebase 字样都没有。
      - name: Assert no Firebase runtime in the APK
        if: success()
        run: |
          APK="$(ls app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | head -1)"
          [ -n "$APK" ] || { echo "❌ 找不到 arm64-v8a 产物,无法断言 Firebase 运行时"; exit 1; }
          python3 scripts/check_x_apk_no_firebase_runtime.py "$APK"

      # 生成 release 说明(新 → 旧)。
      # 为什么要有这一步：GitHub 的 release 资产列表**固定按上传顺序(旧→新)**显示，
      # 且没有 API/设置可以调整(见 Rename 步骤注释)。而说明(body)渲染在资产列表**上方**，
      # 所以把「最新构建」的直链做成表格放说明里 → 打开 release 页第一眼就是最新产物。
      # 历史构建按时间**倒序**列出(最多 6 次)，同样新在上。
      - name: Generate release body (newest first)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_NIGHTLY: ${{ steps.target.outputs.is_nightly }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.target.outputs.version }}
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          TS="${{ steps.ts.outputs.ts }}"
          SHA="${{ steps.sha.outputs.short }}"
          BASE="https://github.com/${REPO}/releases/download/${TARGET_TAG}"
          # 时间戳 20260910-0925 → 可读 2026-09-10 09:25
          PRETTY="${TS:0:4}-${TS:4:2}-${TS:6:2} ${TS:9:2}:${TS:11:2}"
          # 产物名前缀 = 应用名（与 strings.xml 同源），并同上一步**空白折点** ——
          # 两处必须用同一种折法，否则拼出的链接又会与真实资产名对不上
          # （理由见重命名那一步的注释）。
          LABEL_RELEASE="$(sed -nE 's/.*<string name="app_name">([^<]+)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -1)"
          LABEL_NIGHTLY="$(sed -nE 's/.*<string name="app_name_nightly">([^<]+)<\/string>.*/\1/p' app/src/main/res/values/strings.xml | head -1)"
          if [ -z "$LABEL_RELEASE" ] || [ -z "$LABEL_NIGHTLY" ]; then
            echo "❌ 读不到应用名（strings.xml），拒绝按空前缀拼下载链接"
            exit 1
          fi
          # 与重命名那一步同一折法 —— 两处不一致，链接就会再次对不上真实资产名
          to_prefix() {
            printf '%s' "$1" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/./g'
          }
          LABEL_RELEASE="$(to_prefix "$LABEL_RELEASE")"
          LABEL_NIGHTLY="$(to_prefix "$LABEL_NIGHTLY")"
          for _p in "$LABEL_RELEASE" "$LABEL_NIGHTLY"; do
            case "$_p" in
              ""|*[!A-Za-z0-9._-]*|.*|*.)
                echo "❌ 折点后的产物名前缀为空或含非法字符/以点开头结尾：'$_p'（仅允许字母/数字/._-）"
                exit 1
                ;;
            esac
          done
          if [ "$CHANNEL" = "release" ]; then PREFIX="$LABEL_RELEASE"; else PREFIX="$LABEL_NIGHTLY"; fi

          abi_label() {
            case "$1" in
              arm64-v8a) echo "真机(绝大多数手机)" ;;
              universal) echo "通用包(所有架构,体积最大)" ;;
              x86_64)    echo "模拟器 / x86_64" ;;
            esac
          }

          BODY="${GITHUB_WORKSPACE}/release_body.md"
          cd app/build/outputs/apk/release

          {
            # 两个页面都在最顶部放声明框，风格一致（CAUTION 在 GitHub 上是红色，最醒目）。
            if [ "$IS_NIGHTLY" = "true" ]; then
              # 免责声明：nightly 页面会被搜到/被直接下载，必须在最顶部劝退非开发者。
              echo "> [!CAUTION]"
              echo "> **本页面为自动构建的开发测试版,功能不稳定,仅供开发者测试功能使用,请勿下载。**"
              echo
            else
              # Release Build：签名固定、可覆盖升级，但仍是派生自用版本，不声称稳定。
              # 与 nightly 的声明保持同一句式（定位 → 状态 → 适用 → 禁令），只换四个词：
              #   开发测试版 → 尝鲜版；功能不稳定 → 功能仍在快速迭代；
              #   仅供开发者测试功能使用 → 仅供尝鲜体验；请勿下载 → 请勿用于重要场景。
              echo "> [!CAUTION]"
              echo "> **本页面为自动构建的尝鲜版,功能仍在快速迭代,仅供尝鲜体验,请勿用于重要场景。**"
              echo
            fi
            echo
            # 「版本 · commit」行两页完全相同（格式对称）—— 链接文字用短号（与 APK 里的
            # versionName、产物文件名末尾的短号一致，便于肉眼对照），链接目标仍是完整 SHA，
            # 点开即看是哪次提交。版本号取自**本次构建产物**，故用不同代码构建时两页的值
            # 天然不同，不会互相覆盖（同码构建则相同，那也是对的：本就是同一份代码）。
            echo "自动构建 · \`${VERSION}\` · commit [\`${SHA}\`](https://github.com/${REPO}/commit/${{ github.sha }})"
            echo
            echo "## 📥 最新构建 · ${PRETTY}(北京时间)"
            echo
            echo "| 架构 | 适用 | 下载 |"
            echo "|---|---|---|"
            for abi in arm64-v8a universal x86_64; do
              f="${PREFIX}_${TS}_${abi}_${CHANNEL}_${SHA}.apk"
              if [ -f "$f" ]; then
                mb="$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.1f", b/1048576}')"
                echo "| \`${abi}\` | $(abi_label "$abi") | [⬇ 下载 ${mb} MB](${BASE}/${f}) |"
              fi
            done
            echo
            # 2026-09-13 起两页脚注**只差包名那句**:nightly 不再是随机签名,
            # 故「每次装都要先卸载、不能覆盖升级」那条已经作废(它曾是 nightly 最大的麻烦)。
            # 但**包名不同**带来一条新的、必须说的事:nightly 与正式版是**两个应用**,
            # 故第一次从旧的 `…rikkahub.x` 迁到 `…x.nightly` 仍要卸载一次 —— 之后才不用。
            if [ "$IS_NIGHTLY" = "true" ]; then
              echo "> 🔒 固定密钥签名,与正式版**同一把** → 此后每次 nightly 之间可直接**覆盖升级**(无需卸载)。"
              echo ">"
              echo "> ⚠️ 包名是 \`me.rerere.rikkahub.x.nightly\`,与正式版**是两个应用** ——"
              echo "> 好处是可以同时装;代价是**这一次**从旧包迁过来仍需先卸载(数据会清)。"
              echo ">"
              echo "> 签名证书 SHA-256：\`${CERT_SHA256}\`,装前可与本地包比对确认。"
            else
              # 与 nightly 脚注同构：第一句讲「签名性质 → 安装影响」，第二句给可核对的凭据。
              echo "> 🔒 尝鲜版为**固定密钥签名**,每次构建签名相同 → 可直接**覆盖升级**(无需卸载旧版)。"
              echo ">"
              echo "> 签名证书 SHA-256：\`${CERT_SHA256}\`,装前可与本地包比对确认。"
            fi
            echo
          } > "$BODY"

          # 历史构建：从**本渠道**已有 asset 名解析出 (时间戳, 短号)，去重后倒序 → 新在上。
          # ⚠️ 必须用 ${TARGET_TAG} —— 原先写死 nightly，导致尝鲜版页面列出的是 nightly 的产物，
          #    而链接按 BASE 拼成了 /download/release/…，点开全是 404。
          # 历史构建：从**本渠道**已有 asset 名解析出「时间戳 / 短号 / 架构 / 完整文件名」，
          # 去重后倒序 → 新 → 旧。
          # ⚠️ 必须用 ${TARGET_TAG} —— 原先写死 nightly，导致尝鲜版页面列出的是 nightly
          #    而链接按 BASE 拼成了 /download/release/…，点开全是 404。
          # ⚠️ 链接直接用**解析出来的真实资产名**，不按规则重建：原先重建时把渠道段写死成
          #    `release`，于是 nightly 页面的历史链接指向根本不存在的名字 → 同样 404。
          #    资产名取自 API，已不含空白（上传时被平台改写），故链接直接使用、无需编码。
          # ⚠️ 字段分隔符用 `|`：文件名含空格，用空格切字段会把文件名切碎。
          mapfile -t PREV_ROWS < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPO}/releases/tags/${TARGET_TAG}" \
            --jq '.assets[].name' 2>/dev/null \
            | sed -nE 's/^(.*)_([0-9]{8}-[0-9]{4})_(arm64-v8a|universal|x86_64)_(nightly|release)_([0-9a-f]{8})\.apk$/\2|\5|\3|&|/p' \
            | sort -u -r)

          # 同一次构建的三个架构合成一行 → 关联数组按「构建键|架构」索引到真实资产名
          declare -A HIST_FILE=()
          HIST_KEYS=()
          for row in "${PREV_ROWS[@]}"; do
            [ -n "$row" ] || continue
            IFS='|' read -r h_ts h_sha h_abi h_full _ <<< "$row"
            [ -n "$h_full" ] || continue
            h_key="${h_ts} ${h_sha}"
            HIST_FILE["${h_key}|${h_abi}"]="$h_full"
            case " ${HIST_KEYS[*]} " in
              *" ${h_key} "*) ;;
              *) HIST_KEYS+=("$h_key") ;;
            esac
          done

          if [ "${#HIST_KEYS[@]}" -gt 0 ]; then
            {
              echo "## 🕘 历史构建(新 → 旧)"
              echo
            } >> "$BODY"
            n=0
            for h_key in "${HIST_KEYS[@]}"; do
              if [ "$n" -ge 6 ]; then break; fi
              pts="${h_key%% *}"
              psha="${h_key##* }"
              pd="${pts:0:4}-${pts:4:2}-${pts:6:2} ${pts:9:2}:${pts:11:2}"
              links=""
              for abi in arm64-v8a universal x86_64; do
                pfull="${HIST_FILE["${h_key}|${abi}"]:-}"
                [ -n "$pfull" ] || continue
                links="${links}[\`${abi}\`](${BASE}/${pfull}) "
              done
              echo "- **${pd}** · \`${psha}\` — ${links}" >> "$BODY"
              n=$((n + 1))
            done
            echo >> "$BODY"
          fi

          {
            echo "---"
            echo
            echo "文件名规则 = \`${PREFIX}_<构建时间>_<架构>_${CHANNEL}_<短号>.apk\`（前缀取自应用名并把空白折成点，故 release 为 RikkaHub.X、nightly 为 RikkaHub.X.Nightly）。"
            echo "下方 **Assets 列表由 GitHub 按上传时间(旧 → 新)排列,无法调整** —— 故请以上方表格为准下载最新构建。"
          } >> "$BODY"

          echo "=== 生成的 release 说明 ==="
          cat "$BODY"

      # [X-custom] 保留 R8 mapping（2026-09-13）—— 接住 Firebase Crashlytics 的**符号化**职责。
      #
      # ## 为什么必须有这一步
      #
      # Crashlytics 做两件事：收崩溃栈 + **用 mapping.txt 把混淆后的栈还原成类名**。
      # X 整体移除 Firebase 之后，第一件由上游 CrashHandler 与诊断框架接住
      # （见 `x/diag/XCrashReport`），而**第二件在应用内无解** —— release 是 R8 混淆的
      # （`optimization { enable = true }`），解混淆必须要有**构建期**产出的 mapping。
      #
      # 不保留它，崩溃栈会退化成 `at a.b.c.d(Unknown Source:12)`：看得见有崩溃，
      # 看不出在哪 —— 那等于「能收到报警却读不懂」。
      #
      # ## 为什么放 artifact 而不是 release 资产
      #
      # 它是**构建期调试材料**，不是给用户下载的东西：artifact 有过期时间（90 天，
      # 与「出问题时回头查一两周内的崩溃」的用法匹配），也不占 release 页面。
      #
      # 用法：`java -jar retrace.jar mapping.txt crash.txt`
      - name: Keep R8 mapping for crash deobfuscation
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # 用 slug 而不是 ref_name:分支名带斜杠时后者会让 artifact 名字非法、
          # 整步报错 —— 而那会**连带**让后面的「发布 release」不执行(它就是因此没跑)。
          name: r8-mapping-${{ steps.refslug.outputs.slug }}-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/configuration.txt
          # ⚠️ `error` 而不是 `warn`(2026-09-13 改):Firebase Crashlytics 已移除,
          #    于是**没有任何别的服务**替我们保存符号化信息 —— 这一份 mapping 成了
          #    还原崩溃栈的**唯一**手段。它静默缺失的后果是:真机上导出的栈
          #    (R8 处理过,帧名是 `CaptureNode$1$$ExternalSyntheticLambda0` 这种)
          #    永远还原不回原始行号,而**当时不会有任何提示**。
          #    宁可让构建失败在这里,也不要发出一个「崩溃栈将来还原不了」的包。
          if-no-files-found: error
          retention-days: 90

      # 把 APK 直接发布为 Prerelease，用户点链接即可下载单个 apk，无需登录、无需解压。
      # tag 固定 nightly 只保留一条「最新构建」入口；文件名带短提交号所以 asset 不断追加、不覆盖。
      # 说明用 body_path 传入（动态生成、最新在前），见上一步。
      # tag / 名称 / 是否预发布全部取自 Resolve release target —— 正式版不再写进 nightly 入口。
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: success()
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          body_path: release_body.md
          files: app/build/outputs/apk/release/*.apk

      # 保留最近 6 次构建的产物，其余删除。
      #
      # ⚠️ 为什么不用「总数 - 18」计数法（2026-09-10 重构）：
      #   计数法基于**某一时刻的快照**算 to_delete，并发构建时两次运行的快照不同，
      #   叠加后会**多删**（A 见 24 个→删 6；B 见 21 个→再删 3；最终只剩 15 个而非 18 个）；
      #   且重复删除同一 asset 会返回 404 → xargs 退出码非 0 → 整个步骤**误报失败**。
      #
      # ✅ 现改为**幂等的不变式**：「按构建时间保留最新 6 组，删除其余」。
      #   性质：① 无论并发如何交错，都收敛到同一稳态（跑第二遍不会再多删）；
      #        ② **最新构建必然落在保留集内 → 永不删到更新的产物**（计数法无此保证）；
      #        ③ 重复删除按 404 容忍，不再导致步骤失败。
      - name: Cleanup old assets (keep latest 6 builds)
        # nightly 与尝鲜版各自一个固定 tag，两边都按「保留最新 6 组」清理。
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ steps.target.outputs.tag }}
        run: |
          sleep 30   # 等本次上传的 asset 在 API 中可见

          # 一次性取出全部 asset 的 (id, name)：只取一次，避免两次请求快照不一致
          mapfile -t ASSETS < <(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/releases/tags/${TARGET_TAG}" \
            --jq '.assets[] | select(.name | test("[-_][0-9a-f]{8}\\.apk$")) | [.id, .name] | @tsv')
          echo "匹配命名规则的 asset 共 ${#ASSETS[@]} 个"

          # 从文件名解析「构建键」= "构建时间戳 短号"；旧命名解析不出键 → 视为待清理
          key_of() {
            sed -nE 's/^(.*)_([0-9]{8}-[0-9]{4})_(arm64-v8a|universal|x86_64)_(nightly|release)_([0-9a-f]{8})\.apk$/\2 \5/p' <<< "$1"
          }

          KEYS_FILE="$(mktemp)"
          while IFS=$'\t' read -r _id name; do
            [ -n "$name" ] || continue
            key_of "$name"
          done < <(printf '%s\n' "${ASSETS[@]}") | sort -u -r > "$KEYS_FILE"

          # 保留集 = 构建时间最新的 6 组（"时间戳 短号" 降序 → 最新在前）
          declare -A KEEP=()
          kept=0
          while read -r k; do
            [ -n "$k" ] || continue
            if [ "$kept" -ge 6 ]; then break; fi
            KEEP["$k"]=1
            kept=$((kept + 1))
          done < "$KEYS_FILE"
          echo "保留最新 $kept 组构建：$(tr '\n' ' ' < "$KEYS_FILE" | cut -c1-200)"

          # 删除集 = 不在保留集内的 asset（含解析不出构建键的旧命名）
          deleted=0
          failed=0
          while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            k="$(key_of "$name")"
            if [ -n "$k" ] && [ -n "${KEEP[$k]:-}" ]; then
              continue
            fi
            if gh api -X DELETE -H "Accept: application/vnd.github+json" \
                 "repos/${{ github.repository }}/releases/assets/$id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done < <(printf '%s\n' "${ASSETS[@]}")
          rm -f "$KEYS_FILE"

          echo "已删除 $deleted 个旧 asset"
          if [ "$failed" -gt 0 ]; then
            echo "::notice::$failed 个 asset 删除失败（并发下被另一次运行抢先删除会返回 404，属正常，不影响收敛结果）"
          fi
