name: X Custom Guard

# run 标题(2026-09-10):理由同 compile-check.yml —— push 触发的 run 默认用
# commit message 首行当标题,同一 commit 多次触发时标题完全重复。
run-name: "X Custom Guard · ${{ github.event_name }} · ${{ github.ref_name }}"

# X 定制回归守护(2026-09-10)。
#
# 为什么需要:以下几处 X 定制的逻辑细节多、边界绕,改坏了往往**不报错只是算错**
# (如圆环百分比失真、归档静默丢内容),不易察觉。故对相关文件做路径触发 ——
# 平时不跑,改到才跑,作为长期回归守护。
#
# 覆盖:
#   · 工作区归档(WorkspaceArchive):符号链接往返、硬链接内容、路径列举、阈值;
#     含 SEC 断言「经符号链接向外写入必须被拒绝」,防止放宽解析时削弱防护。
#   · 上下文容量表(ContextWindowTable):有序匹配 + 数字版本组对齐,消除版本号错位。
#   · 上下文用量(ContextUsageCalculator):无 usage 时返回 null 而非误导性近似值。
#   · UTF-16 安全切割(Utf16Safe):不切出孤立代理字符。
#   · MCP 名称解耦(McpConfig):显示名回退与连接 key 参与项。
#
# 说明:前身为 verify-context-window.yml(仅覆盖容量表),现扩为统一守护 ——
# 一个 workflow = 一个通知渠道,省去重复的 Gradle 环境搭建。
# 产出:测试报告(XML/HTML)作为 artifact 上传(guard-test-reports,保留 14 天),
# 供回溯逐条耗时与跨批次比对;条数/失败详情另在日志与 Job Summary 中。
# 另见:.github/workflows/daily-build.yml(APK 构建与 nightly 发布)。
on:
  push:
    paths:
      - '.github/workflows/x-custom-guard.yml'
      - 'model-contexts/context-windows.json'
      - 'workspace/src/main/java/me/rerere/workspace/**'
      - 'workspace/src/test/java/me/rerere/workspace/**'
      # 版本号定制(versionCode 时间基数 / versionName 构建元数据)在此文件,改动需重跑守卫
      - 'app/build.gradle.kts'
      - 'app/src/main/java/me/rerere/rikkahub/x/**'
      - 'app/src/test/java/me/rerere/rikkahub/x/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpConfig.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/ai/mcp/McpNameDecouplingAuditTest.kt'
      # 承载 X 定制接线、却位于上游路径下的文件:改动它们同样能改坏上面的守护用例,
      # 而 x/** 的路径过滤覆盖不到,故逐个登记。
      - 'app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/components/ai/ChatInput.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPreferencesXCustomPage.kt'
      # 2026-09-10 补登:ChatService.kt 是 X 定制改动最重的上游文件(压缩执行 / 会话级模型
      # 优先读取 / 会话切换消息保持 / 生成过程自动保存),此前整体不在守护范围内 ——
      # 改它不会触发本工作流,等于这些定制没有回归网。登记后其改动必过一遍 x 包守护测试。
      - 'app/src/main/java/me/rerere/rikkahub/service/ChatService.kt'
      # 2026-09-12 补登:会话页与它的 VM 承载 X 的会话级模型定制(模型闸门口径、
      # 初始化不再抹掉会话级模型)。此前整体不在守护范围内 —— 改它们不会触发本工作流,
      # 而这些定制若被同步上游时冲掉,表现是「在会话里选了模型却发不出去」。
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt'
      # 2026-09-12 补登:语音模式的模型闸门改用会话感知口径(原先读全局口径,只配了会话级
      # 模型时会误报「请先选择聊天模型」)。该文件此前不含 X 定制,自此次改动起承载 X 行为。
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/VoiceMode.kt'
      # 2026-09-12 补登:应用名按渠道取值(标签占位符)。上游若重写该文件并丢掉占位符,
      # 表现是 nightly 包**静默**少了后缀 —— 而别处都正常,故纳入守卫。
      - 'app/src/main/AndroidManifest.xml'
      # 2026-09-12 补登:关于页与前台通知标题此前读 app_name 资源(基础名),
      # 改为运行时读应用标签 —— 这两处都承载 X 的显示名定制。
      # SettingAboutPage.kt 此前就有 [X-custom] 标记却一直没登记,属既有缺口。
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingAboutPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/service/ChatGenerationForegroundService.kt'
      # 2026-09-12 补登(诊断框架独立化):X 的诊断页与它的路由挂载点。
      # 这两者此前只在 storage 分支上,现独立成 diag/consolidate —— 上游重写路由会
      # 让诊断页变成不可达,而 App 行为**看不出异常**,只是「出问题时没有现场可查」。
      - 'app/src/main/java/me/rerere/rikkahub/RouteActivity.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/diagnostic/DiagnosticPage.kt'
      # 2026-09-12 补登:RikkaHubApp.onCreate 是诊断框架的接线点(开关同步读回 + logcat 捕获起停)。
      # 上游若重写该方法而丢掉这几行,表现是**开关重启归零、应用日志一条不记** ——
      # 而 App 行为看起来完全正常,只是「出问题时没有任何现场」。
      # ⚠️ 该文件此前**已带 [X-custom] 标记**(压缩结果通知定制)却一直没登记,属既有缺口,一并补上。
      - 'app/src/main/java/me/rerere/rikkahub/RikkaHubApp.kt'
      # 承载 X 接线:诊断框架的请求记录旁路回调挂在这里(见 Logging.setRequestLogSink)
      - 'common/src/main/java/me/rerere/common/android/Logging.kt'
      # 2026-09-13 补登:本文件决定「请求记录里带不带响应正文」——
      # `peekErrorBody` / `isErrorBodyTruncated` 是 X 加的两个私有函数,
      # 且 `responseBody = if (response.isSuccessful) null else ...` 这条**只记非 2xx**
      # 的口径也在这里(2xx 是 SSE 流,取了会打断流式)。
      # 上游重写本文件会让 net.log 静默失去 respBody —— 而 net.log 正是「服务端为什么拒了」
      # 的唯一留存处(实测 2026-09-13 那个 401:Firebase 看不到、Crashlytics 只收崩溃)。
      - 'app/src/main/java/me/rerere/rikkahub/data/ai/RequestLoggingInterceptor.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # material3 依赖子模块 material-color-utilities,不拉会 Unresolved reference
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # :web:buildWebUi 是 app 编译的前置,与 daily-build 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          chmod +x gradlew
          cp .github/google-services.placeholder.json app/google-services.json

      # 归档用例在独立 workspace 模块;先跑它,失败即停,避免后一步白跑
      - name: Workspace guard tests
        run: |
          ./gradlew :workspace:testDebugUnitTest --console=plain \
            --tests "me.rerere.workspace.x.*"

      # x.* 覆盖容量表/用量/压缩三组 X 定制用例,另加 MCP 名称解耦
      - name: App guard tests
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain \
            --tests "me.rerere.rikkahub.x.*" \
            --tests "me.rerere.rikkahub.data.ai.mcp.McpNameDecouplingAuditTest"

      # 报告文件随 Runner 一起销毁 → 传出来,便于回溯逐条耗时/与历史批次比对
      # (条数与失败详情本就在日志与 Job Summary 里,这里补的是**原始报告可下载**)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/**
            **/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          out = []
          def say(line=""):
              print(line)
              out.append(line)

          files = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          total = 0
          failures = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:  # noqa: BLE001
                  say("! 无法解析 %s: %s" % (path, exc))
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          msg = (node.get("message") or "").strip().replace("\n", " ")
                          failures.append((root.get("name") or "", case.get("name") or "", msg[:300]))

          say("# X 定制回归守护")
          say()
          say("共 %d 个用例,失败 %d 个" % (total, len(failures)))
          for cls, name, msg in failures:
              say()
              say("- ❌ **%s**" % name)
              say("  - 类: `%s`" % cls)
              if msg:
                  say("  - 信息: %s" % msg)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(out) + "\n")
          PY
