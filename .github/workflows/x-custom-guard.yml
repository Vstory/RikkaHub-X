name: X Custom Guard

# run 标题(2026-09-10):理由同 compile-check.yml —— push 触发的 run 默认用
# commit message 首行当标题,同一 commit 多次触发时标题完全重复。
run-name: "X Custom Guard · ${{ github.event_name }} · ${{ github.ref_name }}"

# X 定制回归守护(2026-09-10)。
#
# 为什么需要:以下几处 X 定制的逻辑细节多、边界绕,改坏了往往**不报错只是算错**
# (如圆环百分比失真、归档静默丢内容),不易察觉。故对相关文件做路径触发 ——
# 平时不跑,改到才跑,作为长期回归守护。
#
# 覆盖:
#   · 工作区归档(WorkspaceArchive):符号链接往返、硬链接内容、路径列举、阈值;
#     含 SEC 断言「经符号链接向外写入必须被拒绝」,防止放宽解析时削弱防护。
#   · 上下文容量表(ContextWindowTable):有序匹配 + 数字版本组对齐,消除版本号错位。
#   · 上下文用量(ContextUsageCalculator):无 usage 时返回 null 而非误导性近似值。
#   · UTF-16 安全切割(Utf16Safe):不切出孤立代理字符。
#   · MCP 名称解耦(McpConfig):显示名回退与连接 key 参与项。
#
# 说明:前身为 verify-context-window.yml(仅覆盖容量表),现扩为统一守护 ——
# 一个 workflow = 一个通知渠道,省去重复的 Gradle 环境搭建。
# 产出:测试报告(XML/HTML)作为 artifact 上传(guard-test-reports,保留 14 天),
# 供回溯逐条耗时与跨批次比对;条数/失败详情另在日志与 Job Summary 中。
# 另见:.github/workflows/daily-build.yml(APK 构建与 nightly 发布)。
on:
  push:
    paths:
      - '.github/workflows/x-custom-guard.yml'
      - 'model-contexts/context-windows.json'
      - 'workspace/src/main/java/me/rerere/workspace/**'
      - 'workspace/src/test/java/me/rerere/workspace/**'
      # 版本号定制(versionCode 时间基数 / versionName 构建元数据)在此文件,改动需重跑守卫
      - 'app/build.gradle.kts'
      - 'app/src/main/java/me/rerere/rikkahub/x/**'
      - 'app/src/test/java/me/rerere/rikkahub/x/**'
      - 'app/src/main/java/me/rerere/rikkahub/data/ai/mcp/McpConfig.kt'
      - 'app/src/test/java/me/rerere/rikkahub/data/ai/mcp/McpNameDecouplingAuditTest.kt'
      # 承载 X 定制接线、却位于上游路径下的文件:改动它们同样能改坏上面的守护用例,
      # 而 x/** 的路径过滤覆盖不到,故逐个登记。
      - 'app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/components/ai/ChatInput.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPreferencesXCustomPage.kt'
      # 2026-09-10 补登:ChatService.kt 是 X 定制改动最重的上游文件(压缩执行 / 会话级模型
      # 优先读取 / 会话切换消息保持 / 生成过程自动保存),此前整体不在守护范围内 ——
      # 改它不会触发本工作流,等于这些定制没有回归网。登记后其改动必过一遍 x 包守护测试。
      - 'app/src/main/java/me/rerere/rikkahub/service/ChatService.kt'

      # X 存储层接缝（2026-09-11）：唯一被 X 改动的上游 DB 文件。
      # X 表不注册为 Room 实体，而由该文件的 onOpen 回调调用 XStorageSchema.ensure 建立；
      # 上游若在此处重构/替换回调，X 表会静默建不出来 —— 故纳入守卫。
      - 'app/src/main/java/me/rerere/rikkahub/data/db/AppDatabaseFactory.kt'

      # X 存储层接缝（2026-09-11，P1）：AssetRepository 的 Koin 注册在这里。
      # 上游重构 repositoryModule 时，X 的注册行可能被连带移除或改坏 ——
      # 那种情况下 App 仍能启动（Koin 只在**用到时**才解析），故障延后到第一次
      # 保存附件/清点存储时才出现，且现场离改动很远。故纳入守卫。
      - 'app/src/main/java/me/rerere/rikkahub/di/RepositoryModule.kt'

      # X 存储层接线点（2026-09-11，P1）：资产引用登记的三个调用点都在这里
      # （insertConversation / updateConversation / deleteConversation 各一处）。
      # 本文件另有 X 的会话级模型覆盖定制，此前**整体不在守护范围内** ——
      # 上游合并若冲掉这里的调用，引用表会停止更新，而 App 行为**看不出异常**：
      # 附件照常存、照常显示，只是「谁在用这个文件」的账本不再准。
      # 那种错误只能在回收误删时才暴露，代价不可逆 —— 故纳入守卫。
      - 'app/src/main/java/me/rerere/rikkahub/data/repository/ConversationRepository.kt'

      # X 存储层接线点（2026-09-11，P1-2 补登）：聊天附件的写入路径与删除判据都在这里。
      # 实测教训:接线用的这两个提交(写入路径、备份目录)推送后**本工作流根本没触发** ——
      # 因为清单没覆盖它们,而 Compile Check 照常是绿的,看板上像是「CI 过了」,
      # 实际一份守护测试都没跑。逐条登记后由 `scripts/check_guard_paths.py` 机械把关,
      # 避免再出现「有回归网」被当成「以为有回归网」。
      - 'app/src/main/java/me/rerere/rikkahub/data/files/FilesManager.kt'
      # 扩展名判定:内容寻址与旧式文件名共用它,两处不一致会让去重失效
      - 'app/src/main/java/me/rerere/rikkahub/data/files/FileUtils.kt'
      # 备份与恢复的目录清单:漏了 assets 会「备份成功但换机丢附件」
      - 'app/src/main/java/me/rerere/rikkahub/data/sync/BackupManager.kt'

      # 上述检查器规则覆盖不到的登记项(它们不 import x 包,却承载 X 的行为):
      # X 的页面挂载点与 X 定制页面 —— 上游重写路由会让这些页面变成不可达
      - 'app/src/main/java/me/rerere/rikkahub/RouteActivity.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/diagnostic/DiagnosticPage.kt'
      # 会话页与它的 VM:X 在这里有会话级定制(模型覆盖 / 消息保持 / 输入态)
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatPage.kt'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatVM.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # material3 依赖子模块 material-color-utilities,不拉会 Unresolved reference
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # :web:buildWebUi 是 app 编译的前置,与 daily-build 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          chmod +x gradlew
          cp .github/google-services.placeholder.json app/google-services.json

      # 归档用例在独立 workspace 模块;先跑它,失败即停,避免后一步白跑
      - name: Workspace guard tests
        run: |
          ./gradlew :workspace:testDebugUnitTest --console=plain \
            --tests "me.rerere.workspace.x.*"

      # x.* 覆盖容量表/用量/压缩三组 X 定制用例,另加 MCP 名称解耦
      - name: App guard tests
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain \
            --tests "me.rerere.rikkahub.x.*" \
            --tests "me.rerere.rikkahub.data.ai.mcp.McpNameDecouplingAuditTest"

      # 报告文件随 Runner 一起销毁 → 传出来,便于回溯逐条耗时/与历史批次比对
      # (条数与失败详情本就在日志与 Job Summary 里,这里补的是**原始报告可下载**)
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: guard-test-reports
          path: |
            **/build/test-results/testDebugUnitTest/**
            **/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          out = []
          def say(line=""):
              print(line)
              out.append(line)

          files = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          total = 0
          failures = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:  # noqa: BLE001
                  say("! 无法解析 %s: %s" % (path, exc))
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          msg = (node.get("message") or "").strip().replace("\n", " ")
                          failures.append((root.get("name") or "", case.get("name") or "", msg[:300]))

          say("# X 定制回归守护")
          say()
          say("共 %d 个用例,失败 %d 个" % (total, len(failures)))
          for cls, name, msg in failures:
              say()
              say("- ❌ **%s**" % name)
              say("  - 类: `%s`" % cls)
              if msg:
                  say("  - 信息: %s" % msg)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(out) + "\n")
          PY
