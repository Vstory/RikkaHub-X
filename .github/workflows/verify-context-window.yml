name: Verify context window matching

# 本分支专用验证(2026-09-10):容量表「结构化匹配」改造的 CI 验证。
# 与 audit-tests.yml 的区别:只跑容量表这一个测试类,判定严格(有失败即 job 失败)。
# 验证通过(全绿)后,源文件改动才会被挑进 main —— 本 workflow 与测试不进 main。
on:
  push:
    branches:
      - 'feat/context-window-ordered-match'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # material3 依赖子模块 material-color-utilities,不拉会 Unresolved reference
          submodules: recursive

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      # :web:buildWebUi 是 app 编译的前置,与 daily-build 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-ctxwin-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          chmod +x gradlew
          cp .github/google-services.placeholder.json app/google-services.json

      - name: Context window matching tests
        run: |
          ./gradlew :app:testDebugUnitTest --console=plain \
            --tests "me.rerere.rikkahub.x.context.ContextWindowTableOrderedMatchTest"

      - name: Summarize results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          out = []
          def say(line=""):
              print(line)
              out.append(line)

          files = sorted(glob.glob("**/build/test-results/**/TEST-*.xml", recursive=True))
          total = 0
          failures = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except Exception as exc:  # noqa: BLE001
                  say("! 无法解析 %s: %s" % (path, exc))
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          msg = (node.get("message") or "").strip().replace("\n", " ")
                          failures.append((root.get("name") or "", case.get("name") or "", msg[:300]))

          say("# 容量表匹配验证")
          say()
          say("共 %d 个用例,失败 %d 个" % (total, len(failures)))
          for cls, name, msg in failures:
              say()
              say("- ❌ **%s**" % name)
              say("  - 类: `%s`" % cls)
              if msg:
                  say("  - 信息: %s" % msg)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(out) + "\n")
          PY
