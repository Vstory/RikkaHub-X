name: X Static Checks

# run 标题:push 触发的 run 默认拿 commit message 首行当标题,同一提交多次触发时标题完全
# 重复。显式声明后可按触发方式与分支区分(与 x-custom-audit / x-custom-guard 一致)。
run-name: "X Static Checks · ${{ github.event_name }} · ${{ github.ref_name }}"

# 仓库级静态自检(2026-09-12)。
#
# ## 解决什么
#
# `scripts/` 下有几个**秒级**检查器,判据都是「仓库内的几份文本是否彼此自洽」——
# 不需要 JDK、不需要编译、不需要联网。它们此前**不被任何 workflow 调用**:
#
# | 检查器 | 守什么 | 漏了会怎样 |
# |---|---|---|
# | `check_x_apk_naming.py` | 产物名规则在 `daily-build.yml` 五处是否自洽 | 链接 404 / 历史列表消失 / 旧资产不清理 / 资产被误删 |
# | `check_x_model_resolution.py` | UI 侧是否用了全局模型口径 | 只配了会话级模型时误报「请先选择聊天模型」 |
# | `pangu_format_resources.py` | 中文文案的盘古之白是否已格式化 | 排版回退,得人工重跑脚本 |
# | `check_x_string_resources.py` | 字符串资源里未转义的撇号与重名 | aapt2 拒收 → 资源编译失败,整条 CI 中断 |
# | `check_x_diag_layout.py` | 诊断域枚举 ↔ 文件名 ↔ 目录名是否自洽 | 域文件在包里被标成 `unrecognised` / 清空扫不到旧目录 |
# | `check_x_diag_redaction.py` | 每种导出形态是否都过脱敏、规则顺序、每条规则有无样例 | 新增导出路径**静默**不带脱敏(2026-09-12 实测发生过) |
# | `check_x_manifest.py` | AndroidManifest 上的四处 X 声明(采集开关/广告权限/应用名占位符/接线点) | 采集**静默恢复**、权限重新声明、诊断接线全不执行 —— 都看不出来 |
# | `check_x_event_lists.py` | 域事件「常量 ↔ ALL 清单」是否一一对应、名字形态是否能被 grep | 新事件漏登记 → 不进任何导出与检索(2026-09-13 实测:CI 红了才发现) |
# | `check_x_test_assert_types.py` | `assertEquals` 两边的 Java 类型(如 `1L` 对 `.size`) | 编译通过、本地全绿,断言在**运行时**才炸(2026-09-13 实测:Guard 上红了才发现) |
# | `check_x_missing_imports.py` | 用了 X 自己的类却没 import、或 `import` 的包不存在 | `Unresolved reference`(2026-09-13 三次:两次漏 import、一次形参改一半) |
# | `check_x_when_braces.py` | `when` 分支体多语句却省了花括号 | 报错**指向整个 when**(「must be exhaustive」),看起来不像少了括号(2026-09-13 实测一次) |
# | `check_gh_artifact_names.py` | artifact 名里拼了带斜杠的 `github.ref_name`/`ref`/`head_ref` | 整条 nightly 在最后一步失败,**连带「发布 release」不执行 → 拿不到 APK**(实测:坏了整整一天而看板全绿) |
#
# 而它们守的文件里,`daily-build.yml` **完全不在任何 CI 的 paths 内** —— 改它不触发任何
# 工作流,只能等下次真机构建才暴露。2026-09-12 的下载链接整段 404 就是这么漏过去的:
# 改的正是那个文件里的命名规则,而看板上看不到任何动静。
#
# ## 为什么**单独一个 workflow**,而不是塞进 x-custom-guard
#
# guard 要装 JDK + Node + pnpm 并跑 Gradle 单测(数分钟),为的是验 Kotlin 行为。而本文件的
# 检查只依赖 python3 + sed + bash,**三者合起来不到 1 秒**(本地实测:0.30–0.41 / 0.23–0.35 /
# 0.10–0.14 秒)。塞进 guard 有两重代价:
#
#   ① 改 `daily-build.yml` 会连带触发数分钟的 Kotlin 测试 —— 与改的内容毫不相干;
#   ② guard 带 `paths` 白名单,得把 `daily-build.yml` 登进去才会跑,等于让「改 YAML 里一行
#      注释」触发整套重型回归网。
#
# 单独一个 workflow 才能做到**几十秒内给结论**,把反馈从「下次构建」提前到「推送之后」。
# 这与 `x-custom-audit.yml` 的选择同源 —— 那里也写着:能秒级判定的检查不要塞进 guard。
#
# ## 能力边界
#
# 这些是**静态**检查,验的是「文本之间是否自洽」,验不了运行时行为。产物正确性的最后一道
# 防线仍在构建期(`daily-build.yml` 里那两步:编译前跑本目录的自检、重命名后拿**实际文件名**
# 再断言一次 URL 安全)。三者是互补的:
#
#   推送后(本文件) → 几分钟内知道「规则还自洽吗」
#   构建时(构建里) → 出包前挡住「名字真的不对」的包
on:
  push:
    # 不设 branches 过滤:任何分支都要早发现,不只在 main 上。
    paths:
      # 被检查的对象
      - '.github/workflows/daily-build.yml'
      - 'scripts/check_x_apk_naming.py'
      - 'scripts/check_x_model_resolution.py'
      - 'scripts/pangu_format_resources.py'
      - 'scripts/check_x_string_resources.py'
      - 'scripts/check_x_diag_layout.py'
      - 'scripts/check_x_diag_redaction.py'
      - 'scripts/check_x_diag_redaction_rev.py'
      - 'scripts/check_x_manifest.py'
      - 'scripts/check_x_manifest_rev.py'
      - 'scripts/check_x_event_lists.py'
      - 'scripts/check_x_event_lists_rev.py'
      - 'scripts/check_x_test_assert_types.py'
      - 'scripts/check_x_test_assert_types_rev.py'
      - 'scripts/check_x_missing_imports.py'
      - 'scripts/check_x_missing_imports_rev.py'
      - 'scripts/check_x_when_braces.py'
      - 'scripts/check_x_when_braces_rev.py'
      - 'scripts/check_gh_artifact_names.py'
      - 'scripts/check_gh_artifact_names_rev.py'
      # 它守的是「X 的类 ↔ 用它的文件」,故 X 的源码与全模块 import 都在射程内。
      # 用通配:新增 X 文件时不必回来登记(漏登记 = 新文件不受检)。
      - 'app/src/main/java/me/rerere/rikkahub/x/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/diagnostic/**'
      # XChatEvents 与它的单测 —— 本检查器守的正是这两者之间的一致性,
      # 不登记的话改了事件清单反而不跑(那恰好是它该跑的时候)。
      - 'app/src/main/java/me/rerere/rikkahub/x/chat/XChatEvents.kt'
      - 'app/src/test/java/me/rerere/rikkahub/x/chat/XChatEventsTest.kt'
      # manifest 检查器的输入。**必须登**:上游会持续改这个文件,而 X 在上面挂的四件事
      # 丢了都不报错(采集恢复、广告权限回来、nightly 少后缀、诊断接线不执行)。
      - 'app/src/main/AndroidManifest.xml'
      # 两个诊断检查器的输入(域枚举 / 落盘 / 打包 / 诊断页 / 脱敏规则与它的用例)。
      # 用通配而不是逐个列文件:新增诊断文件时不必回来登记 —— 漏登记正是「改了
      # 却不在检查范围内」这类静默缺口。
      - 'app/src/main/java/me/rerere/rikkahub/x/diag/**'
      - 'app/src/main/java/me/rerere/rikkahub/ui/pages/diagnostic/**'
      # ⚠️ 测试目录也要登:脱敏检查器会读 `XLogScrubTest` 判「每条规则都有样例」,
      #    删掉样例却不触发本工作流的话,那条判据等于不存在。
      - 'app/src/test/java/me/rerere/rikkahub/x/diag/**'
      # 检查器的输入。用**通配**而不是逐个列模块:盘古检查器会扫**所有 Gradle 模块**的
      # values-zh(实测:app / oauth / search 共 3 个 —— `collect_files` 遍历
      # `*/src/main/res`),逐个手写模块名极易漏,而漏掉的后果正是「改了那个模块的文案、
      # 检查却不跑」这种静默缺口。本 workflow 只花几十秒,路径放宽的代价远小于漏检。
      - '**/src/main/res/values/strings.xml'
      - '**/src/main/res/values-zh/strings.xml'
      - '**/src/main/res/values-zh-rTW/strings.xml'
      # 模型口径检查器的扫描面 —— 它只扫 app 的 ui 目录(`UI_ROOT` 是硬编码的)
      - 'app/src/main/java/me/rerere/rikkahub/ui/**'
      # 本文件自身的改动也要自检一遍
      - '.github/workflows/x-custom-static.yml'
  workflow_dispatch:

# 只读即可:不发布、不写仓库。
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # 不需要 git 历史(与 audit 的 fetch-depth: 0 不同)—— 这里只读工作区里的文本,
      # 故保持默认浅检出,少拉一点。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 不装 JDK / Node / pnpm:这几项检查都不需要。装了反而把「几十秒」拖成「几分钟」,
      # 而慢的反馈等于没有反馈。
      #
      # 每一步失败即停(workflow 默认行为),不必额外加 shell 选项。

      # 产物命名规则散在 daily-build.yml 的**五处**(重命名 / 正文「最新构建」/
      # 正文「历史构建」解析 / 清理 jq 匹配 / 清理 key_of),任一处漏改都是**静默错**。
      # 本检查器会用 strings.xml 里的**真实应用名**构造样例资产名,再喂给工作流里的
      # sed / jq 表达式真跑一遍 —— 所以「改应用名导致前缀变化」也会在这里被拦住。
      # 它同时守「构建期那道用现实校验的断言步骤还在、且顺序正确」。
      - name: 产物命名规则自洽性
        run: python3 scripts/check_x_apk_naming.py

      # UI 层不得用全局模型口径(getCurrentChatModel),须走会话感知口径
      # (getConversationChatModel(conversation))。这条曾经以「本地秒级检查全绿、CI 红」
      # 的形态漏到守卫测试才暴露 —— 故在此前移一道。
      - name: UI 模型解析口径
        run: python3 scripts/check_x_model_resolution.py

      # 中文文案的盘古之白(中英文之间插空格)。幂等:已格式化则零改动。
      # 用 --check 只看不改 —— CI 不该改文件,发现未格式化即失败。
      - name: 中文文案盘古格式化
        run: python3 scripts/pangu_format_resources.py --check

      # 字符串资源里 aapt2 会拒收的写法。2026-09-12 漏过一次:文案里 `app's` 的撇号没转义,
      # XML 层面合法(本地用解析器扫过,没报),但 aapt2 报 `does not contain a valid string
      # resource`,资源编译失败 → Guard 与 nightly 双双中断。能秒级判定的规则不该等 CI 才报,
      # 故把那条规则前移到这里;同时查同一文件里的重名(aapt2 也会因此失败)。
      - name: 字符串资源写法
        run: python3 scripts/check_x_string_resources.py

      # 诊断日志的布局自洽:域枚举(key)↔ 落盘文件名 ↔ 打包时的说明 ↔ 会话目录名。
      # 这几处**编译期毫无约束**,漂移了也不会报错 —— 只在读懂导出的包时才暴露:
      # 域文件被写成 `unrecognised file`(看不出属于谁),或改了目录名导致「清空」
      # 扫不到旧目录(点了清空却没清)。
      - name: 诊断日志布局
        run: python3 scripts/check_x_diag_layout.py

      # 诊断脱敏:每种导出形态是否都过脱敏、规则顺序(顺序即优先级)、每条规则有无样例。
      # 「掩对了没有」是行为,归 Guard 里的 Kotlin 单测;这里只守静态能判死的部分,
      # 且**刻意不复刻正则** —— 两套判据迟早漂移,漂移方向恰好是「检查器说没事、真漏了」。
      - name: 诊断脱敏
        run: python3 scripts/check_x_diag_redaction.py

      # 检查器自己也要被验证:11 种破坏(导出路径去掉脱敏 / 删规则 / 打乱优先级 /
      # 删样例 / 关闸门 / 硬编码掩码 / 清空规则表 / 新增形态不加分支 …)必须**每种都被报出**。
      # 它已经抓出过本检查器首版的两处失效(样例判据写成前缀、判据片段被当正则用),
      # 故留在 CI 里当回归网 —— 代价是 11 次子进程,秒级。
      - name: 诊断脱敏检查器的反向验证
        run: python3 scripts/check_x_diag_redaction_rev.py

      # AndroidManifest 上的 X 定制:两条 firebase 采集开关、三条广告 ID 权限的 remove、
      # 应用名占位符、以及 RikkaHubApp 这个诊断接线点。
      # ⚠️ `.kt` 之外的定制**不在标签存活检查的射程内**(Audit 只扫 *.kt 且只在 src/main),
      #    而这几件事被上游 merge 冲掉后都是静默改行为,故只能靠这里守。
      - name: AndroidManifest 定制
        run: python3 scripts/check_x_manifest.py

      # 同上,检查器自己的反向验证(9 种破坏逐一断言被报出)
      - name: manifest 检查器的反向验证
        run: python3 scripts/check_x_manifest_rev.py

      # 域事件的「常量 ↔ ALL 清单」一致性 + 名字形态。
      # ⚠️ 这条是**为一次真实失败补的**(2026-09-13):从 Firebase 迁入 5 个动作计数常量、
      #    忘了登记进 ALL,推送后 CI 红了(275 条用例红 1 条),而当时本地没有任何秒级检查
      #    能提前发现 —— 正是仓库纪律里说的「本地全绿、CI 红」那种最难排查的红。
      #    单测那条已同步改成反射(真去取全部声明),两者刻意并存:单测在 JVM 里验编译后的
      #    真实字段,本检查器不依赖编译、提交前就能跑。
      - name: 域事件清单
        run: python3 scripts/check_x_event_lists.py

      # 同理,反向验证:4 种破坏 + 「扫不到清单必须中止」逐一断言
      - name: 域事件清单检查器的反向验证
        run: python3 scripts/check_x_event_lists_rev.py

      # `assertEquals` 两边的类型。⚠️ 这条是**为一次真实失败补的**(2026-09-13):
      # `assertEquals(1L, map.size)` —— `Map.size` 是 Int,于是 JUnit 选中
      # `assertEquals(Object, Object)`,`Long(1) != Integer(1)` **运行时**才炸。
      # 编译通过、本地检查全绿,只有 Guard 会报 —— 又一种「最难的红的形态」。
      # 判据**刻意收窄**(只挡「字面量的 Java 类型」与「少数几个返回类型确定的属性」),
      # 因为推断出来的类型要判就得做类型推断,那种判据迟早误报 —— 而误报比不检查更坏。
      - name: 断言类型
        run: python3 scripts/check_x_test_assert_types.py

      - name: 断言类型检查器的反向验证
        run: python3 scripts/check_x_test_assert_types_rev.py

      # 漏 import / 包名写错。⚠️ 又是**为真实失败补的**(2026-09-13 一天内三次):
      # ① XSurvivorLog 建好后在 RikkaHubApp 里加了调用却漏 import;
      # ② 同一文件里 XExitReport 又漏;
      # ③ XDiagZip 里 filesOf 的形参改成 File? 之后调用点没跟着改(那条这条检查器不管)。
      # 前两次我写过「Kotlin 侧的错误本地一条都验不到」——**这句对它们不成立**:
      # 「用了别的包的类却没 import」是纯文本可判定的,不必等编译器。
      # ⚠️ 判据**收窄到只守 X 自己的包**:简单名撞车(`Result` 是标准库、`Idle` 是枚举项、
      #    第三方图标库也用 `me.rerere.` 命名空间)会让全仓扫描必然误报 —— 实测修到零误报
      #    花了两轮,而误报会被容忍到没人再信这个检查。
      - name: 漏 import
        run: python3 scripts/check_x_missing_imports.py

      - name: 漏 import 检查器的反向验证
        run: python3 scripts/check_x_missing_imports_rev.py

      # `when` 分支体的花括号。⚠️ 为一次真实失败补的(2026-09-13):`is … ->` 是**单表达式**
      # 分支,而我在它下面加了一个 `val` —— 多语句分支必须带花括号。报错信息指向整个
      # `when`(「must be exhaustive」「Expecting an expression」),看起来完全不像
      # 「少了一对括号」,排查要绕一圈。
      # 判据只认一种形状(箭头在行尾 + 首个非注释子句恰好在下一层缩进 + 那是 val/var):
      # `val` 声明不可能出现在单表达式里,故这条**没有误报空间**。刻意不判「多条语句」,
      # 那样会把多行表达式(调用参数换行写的那种)一起报掉。
      - name: when 花括号
        run: python3 scripts/check_x_when_braces.py

      - name: when 花括号检查器的反向验证
        run: python3 scripts/check_x_when_braces_rev.py

      # artifact 名字:不许拼「带斜杠的上下文值」。⚠️ 为一次**代价不小**的真实失败补的
      # (2026-09-13):`${{ github.ref_name }}` 在特性分支上是 `diag/consolidate`,
      # 而 GitHub 的 artifact 名禁 `/ \ : * ? " < > |` → 整步报错,**连带让后面的
      # 「发布 release」不执行**,于是构建成功了却拿不到 APK。
      # ⚠️ 它坏了整整一天而看板上全绿 —— nightly 只能手动触发,那一步一直没执行过。
      #    **看板绿 ≠ 真的验过**。
      # 判据只在 artifact 步骤内看 `name:`:`run-name:` 用 ref_name 是合法的(显示名)。
      - name: artifact 名字
        run: python3 scripts/check_gh_artifact_names.py

      - name: artifact 名字检查器的反向验证
        run: python3 scripts/check_gh_artifact_names_rev.py
